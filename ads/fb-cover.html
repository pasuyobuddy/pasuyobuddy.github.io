<!doctype html>
<html lang="tl">
<head>
<meta charset="utf-8">
<title>PasuyoBuddy FB Cover</title>
<!-- Facebook page cover, 1640x624. Text kept inside the mobile-safe centre (x 265–1375) and clear of the
     profile picture on desktop (bottom-left). Render: ?lang=tl|en -->
<style>
:root{ --red:#D7141A; --red-d:#B10E13; --yellow:#FFC629; --ink:#15171C; --cream:#FFF7E0 }
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1640px;height:624px;overflow:hidden;background:var(--red)}
body{font-family:"Inter","Noto Color Emoji",sans-serif;color:#fff;position:relative}
.bg{position:absolute;inset:0;background:
   radial-gradient(900px 500px at 75% 40%, rgba(255,198,41,.28), transparent 60%),
   linear-gradient(135deg, #E01A20 0%, #C90F15 60%, #A50B10 100%)}
.stripes{position:absolute;inset:-40px;background:repeating-linear-gradient(-30deg, rgba(255,198,41,.10) 0 26px, transparent 26px 80px)}
/* decorative route across the outer edges (outside the mobile crop it can be cut) */
svg.route{position:absolute;inset:0;width:1640px;height:624px}
.wrap{position:absolute;left:300px;right:265px;top:0;bottom:0;display:flex;align-items:center;gap:40px}
.txt{flex:1;min-width:0}
.kicker{display:inline-block;background:var(--yellow);color:var(--ink);font-weight:900;font-size:22px;letter-spacing:.04em;padding:7px 16px;border-radius:999px}
h1{font-weight:900;font-size:66px;line-height:.98;letter-spacing:-.025em;margin-top:16px;text-shadow:0 4px 0 rgba(0,0,0,.12)}
h1 .y{color:var(--yellow)}
.chips{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap}
.chip{background:#fff;color:var(--ink);font-weight:800;font-size:22px;padding:9px 16px;border-radius:14px;box-shadow:0 4px 0 rgba(0,0,0,.15)}
.chip .r{color:var(--red)}
.meta{display:flex;align-items:center;gap:18px;margin-top:22px;font-weight:800;font-size:24px}
.cta{background:var(--yellow);color:var(--ink);font-weight:900;font-size:26px;padding:12px 26px;border-radius:999px;box-shadow:0 5px 0 var(--red-d)}
.url{font-weight:900;font-size:28px;letter-spacing:-.01em}
.area{font-weight:700;font-size:20px;opacity:.95;margin-top:12px}
.visual{position:relative;width:420px;height:560px;flex:none}
.phone{position:absolute;right:70px;top:18px;width:260px;height:530px;border-radius:38px;background:#111;padding:10px;
  box-shadow:0 30px 60px rgba(0,0,0,.45);transform:rotate(6deg)}
.phone .screen{width:100%;height:100%;border-radius:29px;overflow:hidden;background:#fff}
.phone img{width:100%;display:block}
.track{position:absolute;left:0;bottom:60px;width:230px;background:#fff;border-radius:22px;padding:12px;color:var(--ink);
  box-shadow:0 20px 40px rgba(0,0,0,.35);transform:rotate(-5deg)}
.track .map{height:120px;border-radius:14px;background:#EAF2E3;position:relative;overflow:hidden}
.track .map svg{position:absolute;inset:0;width:100%;height:100%}
.track .status{display:flex;align-items:center;gap:8px;margin-top:10px;font-weight:800;font-size:16px}
.track .status .dot{width:10px;height:10px;border-radius:50%;background:#0B6B45;box-shadow:0 0 0 4px rgba(11,107,69,.18)}
.track .eta{font-weight:700;font-size:14px;color:#5B6070;margin-top:2px}
.moto{position:absolute;right:-12px;bottom:2px;width:218px;filter:drop-shadow(0 18px 18px rgba(0,0,0,.45));z-index:3}
.badge{position:absolute;right:0;top:40px;background:var(--yellow);color:var(--ink);font-weight:900;font-size:17px;padding:10px 14px;border-radius:16px;
  box-shadow:0 12px 24px rgba(0,0,0,.3);transform:rotate(8deg);line-height:1.15;text-align:center}
</style>
</head>
<body>
<div class="bg"></div><div class="stripes"></div>
<svg class="route" viewBox="0 0 1640 624">
  <path d="M-20 560 C 120 520, 160 420, 240 380" stroke="rgba(255,255,255,.35)" stroke-width="6" fill="none" stroke-dasharray="14 14" stroke-linecap="round"/>
  <path d="M1400 90 C 1480 60, 1560 120, 1660 60" stroke="rgba(255,255,255,.35)" stroke-width="6" fill="none" stroke-dasharray="14 14" stroke-linecap="round"/>
  <text x="120" y="150" font-size="96" text-anchor="middle" opacity=".9">📦</text>
</svg>

<div class="wrap">
  <div class="txt">
    <span class="kicker" data-tl="PASUYO DELIVERY · METRO MANILA" data-en="ON-DEMAND DELIVERY · METRO MANILA"></span>
    <h1 data-tl="Padala? Pabili?&lt;br&gt;&lt;span class='y'&gt;Pasuyo kay Buddy!&lt;/span&gt;" data-en="Send it. Buy it.&lt;br&gt;&lt;span class='y'&gt;Leave it to Buddy!&lt;/span&gt;"></h1>
    <div class="chips">
      <span class="chip">📦 <span class="r">Padala</span></span>
      <span class="chip">🛒 <span class="r">Pabili</span></span>
      <span class="chip">💵 <span class="r">COD</span></span>
      <span class="chip">🏍️🚗🚐🚚</span>
    </div>
    <div class="meta">
      <span class="cta" data-tl="BOOK NA! 🚀" data-en="BOOK NOW! 🚀"></span>
      <span class="url">pasuyobuddy.com</span>
    </div>
    <div class="area" data-tl="📍 Buong Metro Manila (NCR) · Live tracking" data-en="📍 All of Metro Manila (NCR) · Live tracking"></div>
  </div>

  <div class="visual">
    <div class="phone"><div class="screen"><img src="../customer_high_demand_preview_1.png" alt=""></div></div>
    <div class="track">
      <div class="map">
        <svg viewBox="0 0 100 60" preserveAspectRatio="none">
          <g stroke="#fff" stroke-width="4" fill="none"><path d="M-5 20 H105"/><path d="M-5 45 H105"/><path d="M30 -5 V65"/><path d="M72 -5 V65"/></g>
          <path d="M10 52 H24 Q30 52 30 46 V26 Q30 20 36 20 H66 Q72 20 72 14 V8" stroke="#D7141A" stroke-width="3" fill="none" stroke-linecap="round"/>
          <circle cx="10" cy="52" r="3.5" fill="#0B6B45"/><circle cx="72" cy="8" r="3.5" fill="#D7141A"/>
        </svg>
        <img src="pb-moto-top.png" alt="" style="position:absolute;left:50%;top:33%;width:52px;transform:translate(-50%,-50%);filter:drop-shadow(0 2px 2px rgba(0,0,0,.35))">
      </div>
      <div class="status"><span class="dot"></span><span data-tl="Papunta na si rider" data-en="Rider on the way"></span></div>
      <div class="eta" data-tl="📍 Live tracking · 6 min" data-en="📍 Live tracking · 6 min"></div>
    </div>
    <img class="moto" src="pb-motorcycle.png" alt="PasuyoBuddy motorcycle">
    <div class="badge" data-tl="📲 May app na!&lt;br&gt;o mag-book online" data-en="📲 Get the app&lt;br&gt;or book online"></div>
  </div>
</div>
<script>
const LANG = new URLSearchParams(location.search).get("lang") || "tl";
document.querySelectorAll("[data-tl]").forEach((el) => { el.innerHTML = el.dataset[LANG] || el.dataset.tl; });
</script>
</body>
</html>
