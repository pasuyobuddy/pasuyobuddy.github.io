.back{border:none;color:#fff;background:rgba(255,255,255,.22);width:36px;height:36px;border-radius:10px;font-size:18px;cursor:pointer;flex-shrink:0}
a.btn{text-decoration:none;white-space:nowrap}
.body{flex:1;padding:16px;display:flex;flex-direction:column;gap:12px;padding-bottom:150px}#app>.body:first-child{padding-top:calc(16px + max(env(safe-area-inset-top), var(--safe-area-inset-top, 0px)))}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
h2{font-size:15px;margin:0 0 8px;font-weight:800}
.muted{color:var(--muted)} .small{font-size:13px} .b{font-weight:800} .right{text-align:right}
.row{display:flex;align-items:center;gap:10px} .sp{flex:1;min-width:0}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-weight:700;cursor:pointer;width:100%}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.pri:disabled{opacity:.5;cursor:default}
.btn.bad{color:var(--bad);border-color:#E9B9A3}
.btn.sm{min-height:38px;width:auto;padding:0 12px;font-size:14px}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:13px;font-weight:700;color:var(--muted)}
.in{min-height:46px;padding:0 12px;border:2px solid #F2C94C;border-radius:10px;background:#FFFBE6;width:100%}
.in::placeholder{color:#8A7A3A}
#pl_q{border-color:var(--yellow);background:#FFF6CC;box-shadow:0 0 0 3px var(--accent-s)}
.btn.yel{background:var(--yellow);border-color:#E0AC10;color:var(--ink)}
textarea.in{padding:10px 12px;min-height:70px;resize:vertical}
.in:focus{outline:2px solid var(--accent);outline-offset:1px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:38px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:#fff;font-weight:700;cursor:pointer}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.chip:disabled{opacity:.45;cursor:default}
.pill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:800}
.p-warn{background:var(--warn-bg);color:var(--warn)} .p-blue{background:var(--blue-bg);color:var(--blue)} .p-good{background:var(--good-bg);color:var(--good)} .p-soft{background:var(--soft);color:var(--muted)} .p-bad{background:var(--bad-bg);color:var(--bad)}
.stop{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer;background:none;border-left:none;border-right:none;border-top:none;width:100%;text-align:left}
.stop:last-child{border-bottom:none}
.dot{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:#fff;flex-shrink:0;margin-top:2px}
.dot.pk{background:var(--ink)} .dot.dr{background:var(--accent)}
.veh{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--line);border-radius:12px;background:#fff;cursor:pointer;width:100%;text-align:left}
.veh.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-s)}
.line{display:flex;justify-content:space-between;gap:12px;padding:5px 0}
.jc{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.jch{background:#D7141A;color:#fff;font-weight:800;padding:8px 14px;display:flex;justify-content:space-between;gap:8px;font-size:15px}
.jcb{padding:10px 14px 14px}.jtag{font-size:12.5px;font-weight:700;padding:3px 9px;border-radius:999px;background:#F3F2EE;color:#444}.jbad{background:#FDECEC;color:#B50F14}
.jrt{display:flex;flex-direction:column;gap:4px}.jst{display:flex;align-items:center;gap:8px;font-weight:700;font-size:16px}.jdot{width:12px;height:12px;border-radius:50%;border:3px solid #1c1d21;flex:0 0 12px;box-sizing:border-box}.jpin{width:12px;text-align:center;font-size:13px}
.jpay{font-size:13px;font-weight:800;padding:4px 10px;border-radius:8px}.jcash{background:#FFF3CD;color:#7A5A00}.jon{background:#E3EEFF;color:#0B4FB3}
.txl{cursor:pointer;border-radius:8px}.txl:active{background:var(--soft)}
.wbal{padding:12px 14px}.wbig{font-size:26px;font-weight:800;line-height:1.1}
.sheetbg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:3000;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:480px;max-height:88vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(20px + max(env(safe-area-inset-bottom), var(--safe-area-inset-bottom, 0px)))}
.line.tot{border-top:1px solid var(--line);margin-top:6px;padding-top:10px;font-weight:800;font-size:16px}
.note{padding:10px 12px;border-radius:10px;font-size:13px}
.n-warn{background:var(--warn-bg);color:var(--warn)} .n-info{background:var(--blue-bg);color:var(--blue)} .n-good{background:var(--good-bg);color:var(--good)} .n-bad{background:var(--bad-bg);color:var(--bad)}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;display:flex;background:var(--card);border-top:1px solid var(--line);z-index:600;padding-bottom:max(env(safe-area-inset-bottom), var(--safe-area-inset-bottom, 0px))}
.nav button{flex:1;min-height:58px;border:none;background:none;font-weight:700;color:var(--muted);cursor:pointer}
.nav button.on{color:var(--accent)}
.foot{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:var(--card);border-top:1px solid var(--line);padding:12px 16px calc(12px + max(env(safe-area-inset-bottom), var(--safe-area-inset-bottom, 0px)));z-index:600}
.mapbtns{position:absolute;top:10px;right:10px;z-index:500;display:flex;flex-direction:column;gap:6px}
.mapbtns button{background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-weight:700;font-size:13px;box-shadow:0 1px 4px rgba(0,0,0,.2);cursor:pointer}
.flg{font-size:30px;line-height:34px;position:relative;text-shadow:0 1px 3px rgba(0,0,0,.5)}
.flg b{position:absolute;right:-6px;top:-4px;font:700 11px/1 sans-serif;background:#D7141A;color:#fff;border-radius:9px;padding:2px 5px;border:1.5px solid #fff}
.flg.dim{opacity:.4}
.rdr{width:40px;height:40px;border-radius:50%;background:#fff;border:3px solid #1D3F8F;box-shadow:0 2px 8px rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;font-size:24px;position:relative}
.vtop{position:relative}.vtop img{position:absolute;left:50%;top:50%;filter:drop-shadow(0 2px 2px rgba(0,0,0,.5));transition:transform .7s ease;max-width:none}
.rdr:after{content:"";position:absolute;inset:-9px;border-radius:50%;border:3px solid rgba(29,63,143,.5);animation:rpulse 1.6s ease-out infinite}
@keyframes rpulse{0%{transform:scale(.6);opacity:1}100%{transform:scale(1.3);opacity:0}}
.map{height:260px;border-radius:12px;overflow:hidden;position:relative;background:var(--soft);z-index:1}
.pin{position:absolute;left:50%;top:50%;width:30px;height:30px;margin:-30px 0 0 -15px;z-index:450;pointer-events:none;font-size:30px;line-height:30px;text-align:center}
.sug{border:1px solid var(--line);border-radius:10px;background:#fff;overflow:hidden}
.sug button{display:block;width:100%;text-align:left;padding:10px 12px;border:none;border-bottom:1px solid var(--line);background:none;cursor:pointer}
.sug button:last-child{border-bottom:none}
.steps{display:flex;flex-direction:column;gap:0}
.step{display:flex;gap:12px;align-items:flex-start;padding:6px 0}
.step .mk{width:18px;height:18px;border-radius:50%;border:2px solid var(--line);background:#fff;flex-shrink:0;margin-top:2px}
.step.done .mk{background:var(--accent);border-color:var(--accent)} .step.now .mk{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-s)}
.step.now{font-weight:800} .step.todo{color:var(--muted)}
.stars{display:flex;gap:6px} .stars button{border:none;background:none;font-size:34px;line-height:1;cursor:pointer;color:#C9C6BC;padding:0}
.stars button.on{color:#E0A100}
.logo{width:64px;height:64px;border-radius:18px;background:var(--yellow);color:var(--accent);border:3px solid var(--accent);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:24px;margin:24px auto 8px}
.chatbox{display:flex;flex-direction:column;gap:8px;padding:14px 16px 170px}
.msg{max-width:80%;padding:9px 12px;border-radius:16px;font-size:15px;line-height:1.35;overflow-wrap:anywhere;white-space:pre-wrap}
.msg.me{align-self:flex-end;background:var(--accent);color:#fff;border-bottom-right-radius:4px}
.msg.them{align-self:flex-start;background:var(--card);border:1px solid var(--line);border-bottom-left-radius:4px}
.msg .t{display:block;font-size:11px;opacity:.75;margin-top:3px}
.chatbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:var(--card);border-top:1px solid var(--line);padding:8px 10px calc(8px + max(env(safe-area-inset-bottom), var(--safe-area-inset-bottom, 0px)));display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end;z-index:600}
.badge{display:inline-block;background:var(--accent);color:#fff;border-radius:10px;padding:1px 8px;font-size:12px;font-weight:700;margin-left:4px}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 16px;border-radius:12px;max-width:90%;z-index:2000;font-weight:600;text-align:center}
.toast.err{background:var(--bad)}
.spin{padding:40px 0;text-align:center;color:var(--muted)}
a{color:var(--accent);font-weight:700}
</style>
</head>

function phoneDigits(v) { var d = String(v || "").replace(/\D/g, ""); if (d.indexOf("63") === 0) d = "0" + d.slice(2); else if (d.charAt(0) === "9") d = "0" + d; return d.slice(0, 11); }

// ---------------- Android app extras (PasuyoBuddy Rider app from Google Play / APK) ----------------
// In the Android app, location keeps being shared while the rider is online or on a job, even when the app
// is minimized, the screen is off or Waze is open (Android shows a "sharing your location" notification).
// New jobs come as phone notifications while online. In a normal browser none of this runs.
var NATIVE = !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform());
var NAT = { bg: null, ln: null, app: null, http: null, watcher: null, starting: false, active: true, lastSent: 0, lastJobs: 0, told: {}, tr: null, trOn: false, trJob: null, bat: null };

// Supabase call through Android's own internet connection (keeps working in the background)
async function nativeRpc(name, params) {

function nativeWanted() { var r = rider(); return !!(S.session && r && r.status === "approved" && (r.is_online || (S.me && S.me.active_order))); }

  if (!NATIVE || NAT.starting) return;

      try { await NAT.ln.requestPermissions(); } catch (e) {}
      NAT.watcher = await NAT.bg.addWatcher({ backgroundTitle: "PasuyoBuddy Rider: you are online",

      stopGps();   // the browser GPS is not needed while the app's own GPS runs
    } catch (e) { S.posErr = "Could not start location sharing. Allow location for PasuyoBuddy Rider in your phone settings."; }

    var id = NAT.watcher; NAT.watcher = null;
    try { await NAT.bg.removeWatcher({ id: id }); } catch (e) {}

async function trackerSync(force) {

  if (want) {
    try { st = await NAT.tr.status(); } catch (e) {}
    if (NAT.trOn && st && st.running) {
      NAT.bat = st.batteryUnrestricted;
      if (NAT.trJob !== job) { NAT.trJob = job; try { await NAT.tr.setMode({ onJob: job }); } catch (e) {} }
      return;

    try {
      try { await NAT.ln.requestPermissions(); } catch (e) {}
      st = await NAT.tr.start({ url: CONFIG.url, key: CONFIG.key, token: tok, onJob: job });
      NAT.trOn = true; NAT.trJob = job; NAT.bat = st ? st.batteryUnrestricted : null; S.posErr = "";
      stopGps();   // the browser GPS is not needed while the tracker runs
    } catch (e) { NAT.trOn = false; S.posErr = "Could not start location sharing. Allow location for PasuyoBuddy Rider in your phone settings."; }
    NAT.starting = false;
  } else if (NAT.trOn || ((st = await NAT.tr.status().catch(function () { return null; })) && st.running)) {

  if (NATIVE || !/Android/i.test(navigator.userAgent)) return "";
  return '<div class="note n-warn" style="text-align:left">&#128242; <b>Riders: please use the PasuyoBuddy Rider app.</b> This website version stops sharing your location when you minimize it or use Waze, so you may miss jobs. Get the app from PasuyoBuddy (Google Play soon).</div>';

setInterval(function () {
  if (!NATIVE || !NAT.tr || !S.session || !nativeWanted() || NAT.starting) return;

    if (st) NAT.bat = st.batteryUnrestricted;
    if (st && !st.running) { NAT.trOn = false; nativeSync(); }

// ---------------- Promos (free load, invite riders) ----------------
function deviceId() {
  var k = "pb_device", v = null;
  try { v = localStorage.getItem(k); } catch (e) {}
  if (!v) { v = (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : "d" + Date.now().toString(36) + Math.random().toString(36).slice(2, 12); try { localStorage.setItem(k, v); } catch (e) {} }
  return v;
}
var PROMO_SENT = false;
async function loadPromos() {
  var r = rider(); if (!r) return;
  if (!PROMO_SENT) { PROMO_SENT = true; try { await rpc("rider_set_device", { p_device: deviceId() }); } catch (e) {} }
  try { S.promos = await rpc("rider_promos"); } catch (e) { S.promos = null; }
}
function promoLeftText(p) { return (p.active || []).map(function (g) { return '<div class="line small"><span class="sp">&#127873; Free load ' + (g.kind === "referral" ? "(invite reward)" : "(welcome)") + '<br><span class="muted">expires ' + h(when(g.expires_at)) + '</span></span><span class="b">' + peso(g.left) + "</span></div>"; }).join(""); }
function promoWalletCard() {
  var p = S.promos; if (!p || !(p.active || []).length) return "";
  return '<div class="card" style="border-color:#E5A700"><h2 style="margin:0 0 4px">Free load</h2>' + promoLeftText(p)
    + '<div class="small muted" style="margin-top:6px">Free load is part of your Load. It is used first for commissions and cannot be cashed out. Any amount not used by the expiry date is removed.</div></div>';
}
function referralApplyCard() {
  var p = S.promos, r = rider(); if (!p || r.status !== "pending") return "";
  var welcome = p.signup_load > 0 ? '<div class="note n-good">&#127873; When you are approved you get <b>' + peso(p.signup_load) + " free load</b>" + (p.vehicle ? " for your " + h(p.vehicle) : "") + " to pay your first commissions.</div>" : "";
  if (p.referred_by) return welcome + '<div class="card"><div class="line"><span class="muted">Invited by</span><span class="b">' + h(p.referred_by) + " &#10004;</span></div></div>";
  if (!(p.referral_load > 0)) return welcome;   // invite rewards switched off: no invite-code box
  return welcome + '<div class="card" style="display:flex;flex-direction:column;gap:8px"><h2 style="margin:0">Invited by another rider?</h2><div class="small muted">Enter their invite code. You can only do this before you are approved.</div>'
    + '<div class="row" style="gap:8px"><input class="in" id="refcode" maxlength="10" placeholder="e.g. PB7K2QX" style="flex:1;text-transform:uppercase" autocapitalize="characters"><button class="btn pri" style="width:auto" data-act="refset">Use code</button></div></div>';
}
function inviteCard() {
  var p = S.promos; if (!p || !p.ref_code || !(p.referral_load > 0)) return "";
  var list = (p.referrals || []).map(function (x) {
    var st = x.reward === "active" || x.reward === "used" || x.reward === "expired" ? pill("Reward given", "good") : x.reward === "skipped" ? pill("Not eligible", "soft")
      : x.status !== "approved" ? pill("Waiting for approval", "warn") : pill(Math.min(x.jobs, p.referral_jobs) + "/" + p.referral_jobs + " jobs", "warn");
    return '<div class="line small"><span class="sp">' + h(x.name) + "</span>" + st + "</div>"; }).join("");
  return '<div class="card" style="display:flex;flex-direction:column;gap:8px;border-color:#E5A700"><h2 style="margin:0">&#129309; Invite riders, get free load</h2>'
    + '<div class="small muted">Give your code to a new rider. When they are approved and finish <b>' + p.referral_jobs + " jobs</b>, you get <b>" + peso(p.referral_load) + " free load</b>.</div>"
    + '<div class="row" style="gap:8px;align-items:center"><div class="b" style="flex:1;font-size:24px;letter-spacing:2px;text-align:center;border:2px dashed #E5A700;border-radius:12px;padding:8px">' + h(p.ref_code) + '</div><button class="btn sm" style="width:auto" data-act="refcode">Copy code</button></div>'
    + '<button class="btn yel" style="margin-top:8px" data-act="refcopy">&#128228; Share invite link</button><div class="small muted" style="margin-top:4px">The link already has your code, so the new rider does not need to type it.</div>'
    + (list ? '<div class="small b" style="margin-top:4px">Riders you invited</div>' + list : "") + "</div>";
}
async function setReferral() {
  var c = (val("refcode") || "").toUpperCase().replace(/\s+/g, ""); if (c.length < 5) { toast("Enter the invite code", true); return; }
  await run(async function () { var name = await rpc("rider_set_referral", { p_code: c }); await loadPromos(); S.busy = false; render(); toast("Invite code saved. Invited by " + name); });
}
async function copyRef() {
  var c = S.promos && S.promos.ref_code; if (!c) return;
  var link = "https://pasuyobuddy.com/rider.html?ref=" + encodeURIComponent(c);

function vApply() {
  var opts = S.me.vehicles.map(function (v) { return '<option value="' + v.id + '">' + h(v.name) + " (up to " + v.max_kg + " kg)</option>"; }).join("");
  return topBar("Become a rider") + '<div class="body"><div class="note n-info">Step 1 of 2. Tell us about you and your vehicle.</div>'
    + '<div class="card" style="display:flex;flex-direction:column;gap:12px">'
    + '<div class="field"><label for="ap_name">Full name (as on your license)</label><input class="in" id="ap_name" autocomplete="name" value="' + h(S.me.name) + '"></div>' + '<div class="small" style="color:var(--warn);font-weight:700">&#128274; Use your real name and your own number. After you apply, only spelling mistakes can be corrected later, with your license.</div>'
    + '<div class="field"><label for="ap_phone">Mobile number</label><input class="in" id="ap_phone" type="tel" inputmode="numeric" maxlength="13" placeholder="09XX XXX XXXX" value="' + h(phoneFmt(S.me.phone)) + '"></div>'
    + '<div class="field"><label for="ap_vehicle">Vehicle</label><select class="in" id="ap_vehicle">' + opts + "</select></div>"
    + '<div class="field"><label for="ap_plate">Plate number</label><input class="in" id="ap_plate" autocapitalize="characters" placeholder="e.g. NFX 1234"></div>'
    + '<button class="btn pri" data-act="apply">Continue</button></div><button class="btn bad" data-act="signout">Sign out</button></div>';
}
// Vehicle owner: riders who use a vehicle not registered in their name upload the owner's authorization + ID
function ownerCard(r) {
  if (r.status === "approved") return "";
  var ow = S.owner || {}, no = ow.self === false || S.ownerAsk === "no";
  return '<div class="card" style="display:flex;flex-direction:column;gap:10px"><h2>Vehicle owner</h2><div class="b">Is this vehicle registered (OR/CR) in your name?</div>'
    + '<div class="chips"><button class="chip' + (ow.self === true && S.ownerAsk !== "no" ? " on" : "") + '" data-act="ownerself" data-v="1">Yes, it\'s mine</button><button class="chip' + (no ? " on" : "") + '" data-act="ownerself" data-v="0">No, someone else owns it</button></div>'
    + (no ? '<div class="field"><label for="own_name">Full name of the registered owner (as on the OR/CR)</label><input class="in" id="own_name" maxlength="120" autocomplete="off" value="' + h(ow.owner_name || "") + '"></div>'
      + '<button class="btn pri" data-act="ownersave">' + (ow.self === false ? "Update owner name" : "Save") + "</button>"

// ---------------- Events ----------------
document.addEventListener("click", function (ev) {
  var t = ev.target.closest("[data-act]"); if (!t) return; var a = t.getAttribute("data-act"), d = t.dataset;
  if (a === "auth") doAuth();
  else if (a === "verify") doVerify();
  else if (a === "forgot") { S.authEmail = val("a_email") || S.authEmail; S.authMode = "forgot"; RESET.step = "email"; S.authMsg = ""; render(); }
  else if (a === "forgotsend") forgotSend(false);
  else if (a === "forgotresend") forgotSend(true);
  else if (a === "forgotsave") forgotSave();
  else if (a === "forgotback") { S.authMode = "login"; RESET.step = "email"; S.authMsg = ""; render(); }
  else if (a === "resendcode") resendCode();
  else if (a === "verifyback") { try { localStorage.removeItem("pb_verify_email"); } catch (e) {} S.authMode = "signup"; S.authMsg = ""; render(); }
  else if (a === "authmode") { S.authEmail = val("a_email"); S.authMode = S.authMode === "login" ? "signup" : "login"; S.authMsg = ""; render(); }
  else if (a === "signout") signOut();
  else if (a === "tuamt") { TOPUP.amount = +d.v; var inp = $("tu_amt"); if (inp) inp.value = d.v; document.querySelectorAll('[data-act="tuamt"]').forEach(function (b) { b.classList.toggle("on", b === t); }); TOPUP.quote = null; loadTopupQuote(); }
  else if (a === "tupay") payTopup();
  else if (a === "tureopen") reopenTopup();
  else if (a === "e2l") earningsToLoad();
  else if (a === "pushon") enablePush();
  else if (a === "pushoff") disablePush();
  else if (a === "chatopen") { if (S.order) openChat(S.order.id); }
  else if (a === "repopen") { REP_FROM = d.from || "job"; var oid = d.id || (S.order && S.order.id); if (oid) openReport(oid); }
  else if (a === "repback") { if (REP_FROM === "job") openJob(REP.order); else goHome(); }
  else if (a === "repreason") { var nv = $("rep_note") ? $("rep_note").value : ""; REP.reason = REP_REASONS[+d.i]; render(); if ($("rep_note")) $("rep_note").value = nv; }
  else if (a === "repsend") sendReport();
  else if (a === "chatback") { stopChat(); openJob(CHAT.id); }
  else if (a === "chatsend") sendChat(val("chat_in"));
  else if (a === "chatquick") sendChat(CHAT_QUICK[+d.i]);
  else if (a === "hidejob") { HIDDEN[d.id] = Date.now(); saveHidden(); render(); toast("Job hidden. Other riders can still take it."); }
  else if (a === "unhidejobs") { HIDDEN = {}; saveHidden(); render(); }
  else if (a === "confirmedgo") { S.confirmErr = ""; if (S.session) afterLogin(); else { S.view = "auth"; S.authMode = "login"; render(); } }
  else if (a === "mapme") { if (mapObj && S.pos) { FOLLOW.on = true; FOLLOW.free = false; mapObj.setView(meMk ? meMk.getLatLng() : [S.pos.lat, S.pos.lng], 15); toast("Following you. Move the map to stop."); } else toast("Finding your location…", true); }
  else if (a === "mapall") { FOLLOW.on = false; FOLLOW.free = false; if (mapObj && S.order) { var q = S.order.stops.map(function (x) { return [x.lat, x.lng]; }); if (S.pos) q.push([S.pos.lat, S.pos.lng]); mapObj.fitBounds(q, { padding: [28, 28], maxZoom: 15 }); } }
  else if (a === "apply") apply();
  else if (a === "check") checkStatus();
  else if (a === "noticeok") noticeOk(+d.v);
  else if (a === "online") setOnline(d.v === "1");
  else if (a === "home") run(async function () { await reloadMe(); S.busy = false; if (S.me.active_order) await openJob(S.me.active_order); else await goHome(); });
  else if (a === "wallet") showWallet();
  else if (a === "history") showHistory();
  else if (a === "account") { stopTimers(); S.view = "account"; S.chgOpen = false; render(); loadChg(); supLoadUnread().then(function () { if (S.view === "account") render(); }); loadPromos().then(function () { if (S.view === "account") render(); }); }
  else if (a === "refset") setReferral();
  else if (a === "refcopy") copyRef();
  else if (a === "refcode") copyRefCode();
  else if (a === "docpick") docPick(d.t);
  else if (/^lock-/.test(a)) lockAct(a, d);
  else if (a === "loi-open") loiOpen();
  else if (a === "owa-open") owaOpen();
  else if (a === "owa-id") owaPickId("id");
  else if (a === "owa-self") owaPickId("self");
  else if (a === "owa-clear") { owaSave(); if (d.w === "O") OWA.sigO = []; else OWA.sigR = []; render(); }
  else if (a === "owa-send") owaSend();
  else if (a === "owa-back") { owaSave(); S.view = "docs"; render(); window.scrollTo(0, 0); }
  else if (a === "loi-clear") { LOI.strokes = []; loiSave(); render(); }
  else if (a === "loi-send") loiSend();
  else if (a === "loi-back") { loiSave(); S.view = "docs"; render(); window.scrollTo(0, 0); }
  else if (a === "ownerself") { if (d.v === "1") ownerSet(true); else { S.ownerAsk = "no"; render(); } }
  else if (a === "ownersave") ownerSet(false);
  else if (a === "accept") accept(d.id);
  else if (a === "step") step(d.s.split(","));
  else if (a === "canceljob") cancelJob();
  else if (a === "asknone") { S.ask = ""; render(); }
  else if (a === "arrivedrop") arrivedStop();
  else if (a === "supopen") { stopTimers(); supList(); }
  else if (a === "supnew") { S.supNew = true; render(); }
  else if (a === "supcancel") { S.supNew = false; render(); }
  else if (a === "supsend") supSend();
  else if (a === "supview") supView(d.id);
  else if (a === "supreply") supReply();

<script>
// Show / hide password: an eye button inside every password box (login, sign-up, new password, PIN)
(function () {
  var EYE = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>';
  var NOEYE = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 19c-7 0-11-7-11-7a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 7 11 7a18.5 18.5 0 0 1-2.16 3.19"/><path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/><path d="M1 1l22 22"/></svg>';

    var b = document.createElement("button"); b.type = "button"; b.tabIndex = -1; b.className = "pw-eye";

    b.addEventListener("click", function (e) {

    });

  }
