name: Build Transcribe Buddy APK

on:
  push:
    branches: [main, claude/skills-access-0spucy]
    paths:
      - "android/TranscribeBuddy/**"
      - ".github/workflows/build-android.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: android/TranscribeBuddy
    env:
      VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # The ubuntu runner ships with the Android SDK; just add the exact packages we need.
      - name: Install SDK packages
        run: |
          SDKM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          echo "Using $SDKM"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Fetch whisper.cpp
        run: git clone --depth 1 --branch v1.8.2 https://github.com/ggml-org/whisper.cpp app/src/main/cpp/whisper.cpp

      - uses: gradle/actions/setup-gradle@v4

      # Keeps the same signing key between builds so new APKs install as updates
      # (used only when no release key is stored in repository secrets).
      - name: Restore signing key cache
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: transcribebuddy-debug-keystore

      - name: Release signing key from secrets (optional)
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi

      - name: Unit tests
        run: ./gradlew --no-daemon testReleaseUnitTest

      - name: Build APK
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/TranscribeBuddy.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: TranscribeBuddy-apk
          path: TranscribeBuddy.apk

      - name: Publish to "Transcribe Buddy (latest build)" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: transcribe-latest
          name: Transcribe Buddy (latest build)
          prerelease: true
          make_latest: false
          body: |
            Latest Android build of Transcribe Buddy (build ${{ github.run_number }}, commit ${{ github.sha }}).
            Download **TranscribeBuddy.apk** on your phone and open it to install.
          files: TranscribeBuddy.apk
