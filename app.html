.back{border:none;color:#fff;background:rgba(255,255,255,.22);width:36px;height:36px;border-radius:10px;font-size:18px;cursor:pointer;flex-shrink:0}
.body{flex:1;padding:16px;display:flex;flex-direction:column;gap:12px;padding-bottom:150px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
h2{font-size:15px;margin:0 0 8px;font-weight:800}
.muted{color:var(--muted)} .small{font-size:13px} .b{font-weight:800} .right{text-align:right}
.row{display:flex;align-items:center;gap:10px} .sp{flex:1;min-width:0}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-weight:700;cursor:pointer;width:100%}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.pri:disabled{opacity:.5;cursor:default}
.btn.bad{color:var(--bad);border-color:#E9B9A3}
.btn.sm{min-height:38px;width:auto;padding:0 12px;font-size:14px}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:13px;font-weight:700;color:var(--muted)}
.in{min-height:46px;padding:0 12px;border:2px solid #F2C94C;border-radius:10px;background:#FFFBE6;width:100%}
.in::placeholder{color:#8A7A3A}
#pl_q{border-color:var(--yellow);background:#FFF6CC;box-shadow:0 0 0 3px var(--accent-s)}
.btn.yel{background:var(--yellow);border-color:#E0AC10;color:var(--ink)}
textarea.in{padding:10px 12px;min-height:70px;resize:vertical}
.in:focus{outline:2px solid var(--accent);outline-offset:1px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:38px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:#fff;font-weight:700;cursor:pointer}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.chip:disabled{opacity:.45;cursor:default}
.pill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:800}
.p-warn{background:var(--warn-bg);color:var(--warn)} .p-blue{background:var(--blue-bg);color:var(--blue)} .p-good{background:var(--good-bg);color:var(--good)} .p-soft{background:var(--soft);color:var(--muted)} .p-bad{background:var(--bad-bg);color:var(--bad)}
.stop{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer;background:none;border-left:none;border-right:none;border-top:none;width:100%;text-align:left}
.stop:last-child{border-bottom:none}
.dot{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:#fff;flex-shrink:0;margin-top:2px}
.dot.pk{background:var(--ink)} .dot.dr{background:var(--accent)}
.veh{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--line);border-radius:12px;background:#fff;cursor:pointer;width:100%;text-align:left}
.ocard{padding:9px 12px;gap:10px;align-items:flex-start}.ocard .pill{font-size:11.5px;padding:2px 8px;margin-top:3px}.oroute{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wtx{display:inline-block;font-size:12px;font-weight:800;padding:2px 8px;border-radius:999px}.wtx-g{background:#E3F6EA;color:#11753A}.wtx-y{background:#FFF3CD;color:#7A5A00}.wtx-s{background:#F3F2EE;color:#555}
.veh.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-s)}
.vgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;align-items:start}
.vc{position:relative;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:6px 8px 8px;font:inherit;color:inherit;cursor:pointer;width:100%}
.vc.on{border-color:var(--accent);background:#fff;box-shadow:0 0 0 2px var(--accent-s)}
.vc svg,.vc img{width:100%;height:48px;object-fit:contain;display:block;margin:0 auto 4px}
.vc .vn{font-weight:800;font-size:13.5px;line-height:1.2}.vc .vk{font-size:11.5px;color:var(--muted)}.vc .vp{font-size:14.5px;font-weight:800;color:var(--accent);margin-top:1px}
.vc .vm{display:none;font-size:11.5px;color:var(--muted);margin-top:6px;line-height:1.4}.vc.on .vm{display:block}
.vtag{position:absolute;top:5px;right:5px;z-index:1;background:var(--yellow);color:var(--ink);font-size:9.5px;font-weight:800;border-radius:999px;padding:2px 6px}
.vhelp{width:100%;border-collapse:collapse;font-size:12.5px}.vhelp td,.vhelp th{padding:7px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}.vhelp th{background:#FFF4D6}
.linkbtn{background:none;border:none;color:var(--accent);font-weight:800;font-size:13px;cursor:pointer;padding:4px 0}
.line{display:flex;justify-content:space-between;gap:12px;padding:5px 0}
.line.tot{border-top:1px solid var(--line);margin-top:6px;padding-top:10px;font-weight:800;font-size:16px}
.note{padding:10px 12px;border-radius:10px;font-size:13px}
.n-warn{background:var(--warn-bg);color:var(--warn)} .n-info{background:var(--blue-bg);color:var(--blue)} .n-good{background:var(--good-bg);color:var(--good)} .n-bad{background:var(--bad-bg);color:var(--bad)}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;display:flex;background:var(--card);border-top:1px solid var(--line);z-index:600;padding-bottom:env(safe-area-inset-bottom)}
.nav button{flex:1;min-height:58px;border:none;background:none;font-weight:700;color:var(--muted);cursor:pointer}
.nav button.on{color:var(--accent)}
.foot{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:var(--card);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom));z-index:600}
.mapbtns{position:absolute;top:10px;right:10px;z-index:500;display:flex;flex-direction:column;gap:6px}
.mapbtns button{background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-weight:700;font-size:13px;box-shadow:0 1px 4px rgba(0,0,0,.2);cursor:pointer}
.flg{font-size:30px;line-height:34px;position:relative;text-shadow:0 1px 3px rgba(0,0,0,.5)}
.flg b{position:absolute;right:-6px;top:-4px;font:700 11px/1 sans-serif;background:#D7141A;color:#fff;border-radius:9px;padding:2px 5px;border:1.5px solid #fff}
.flg.dim{opacity:.4}
.rdr{width:40px;height:40px;border-radius:50%;background:#fff;border:3px solid #1D3F8F;box-shadow:0 2px 8px rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;font-size:24px;position:relative}
.vtop{position:relative}.vtop img{position:absolute;left:50%;top:50%;filter:drop-shadow(0 2px 2px rgba(0,0,0,.5));transition:transform .7s ease;max-width:none}
.rdr:after{content:"";position:absolute;inset:-9px;border-radius:50%;border:3px solid rgba(29,63,143,.5);animation:rpulse 1.6s ease-out infinite}
@keyframes rpulse{0%{transform:scale(.6);opacity:1}100%{transform:scale(1.3);opacity:0}}
.map{height:260px;border-radius:12px;overflow:hidden;position:relative;background:var(--soft);z-index:1}
.pin{position:absolute;left:50%;top:50%;width:30px;height:30px;margin:-30px 0 0 -15px;z-index:450;pointer-events:none;font-size:30px;line-height:30px;text-align:center}
.sug{border:1px solid var(--line);border-radius:10px;background:#fff;overflow:hidden}
.sug button{display:block;width:100%;text-align:left;padding:10px 12px;border:none;border-bottom:1px solid var(--line);background:none;cursor:pointer}
.sug button:last-child{border-bottom:none}
.steps{display:flex;flex-direction:column;gap:0}
.step{display:flex;gap:12px;align-items:flex-start;padding:6px 0}
.step .mk{width:18px;height:18px;border-radius:50%;border:2px solid var(--line);background:#fff;flex-shrink:0;margin-top:2px}
.step.done .mk{background:var(--accent);border-color:var(--accent)} .step.now .mk{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-s)}
.step.now{font-weight:800} .step.todo{color:var(--muted)}
.stars{display:flex;gap:6px} .stars button{border:none;background:none;font-size:34px;line-height:1;cursor:pointer;color:#C9C6BC;padding:0}
.stars button.on{color:#E0A100}
.logo{width:64px;height:64px;border-radius:18px;background:var(--yellow);color:var(--accent);border:3px solid var(--accent);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:24px;margin:24px auto 8px}
.chatbox{display:flex;flex-direction:column;gap:8px;padding:14px 16px 170px}
.msg{max-width:80%;padding:9px 12px;border-radius:16px;font-size:15px;line-height:1.35;overflow-wrap:anywhere;white-space:pre-wrap}
.msg.me{align-self:flex-end;background:var(--accent);color:#fff;border-bottom-right-radius:4px}
.msg.them{align-self:flex-start;background:var(--card);border:1px solid var(--line);border-bottom-left-radius:4px}
.msg .t{display:block;font-size:11px;opacity:.75;margin-top:3px}
.chatbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:var(--card);border-top:1px solid var(--line);padding:8px 10px calc(8px + env(safe-area-inset-bottom));display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end;z-index:600}
.badge{display:inline-block;background:var(--accent);color:#fff;border-radius:10px;padding:1px 8px;font-size:12px;font-weight:700;margin-left:4px}
.bagopt{display:flex;gap:10px;align-items:flex-start;margin-top:12px;padding:12px;border:2px solid #F2C94C;border-radius:12px;background:#FFFBE6;cursor:pointer}
.bagopt.on{border-color:var(--accent);background:var(--accent-s)}
.bagopt input{width:22px;height:22px;margin-top:2px;accent-color:var(--accent);flex:none}
.rphoto{width:64px;height:64px;border-radius:50%;object-fit:cover;border:3px solid var(--yellow);background:var(--soft);flex:none;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:24px;color:var(--accent)}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 16px;border-radius:12px;max-width:90%;z-index:2000;font-weight:600;text-align:center}
.toast.err{background:var(--bad)}
.spin{padding:40px 0;text-align:center;color:var(--muted)}
a{color:var(--accent);font-weight:700}
html,body{touch-action:manipulation}
</style>
</head>

// A random id for this phone (kept in the browser), so one phone gets the first-delivery promo only once
function deviceId() { try { var d = localStorage.getItem("pb_device"); if (!d) { d = "d" + Math.random().toString(36).slice(2) + Date.now().toString(36); localStorage.setItem("pb_device", d); } return d; } catch (e) { return ""; } }
async function loadPromo() { try { S.promo = await rpc("customer_promo_status"); } catch (e) { S.promo = null; } }
async function afterLogin() {
  try { S.me = await rpc("customer_me"); }
  catch (e) { S.session = null; S.authMsg = e.message; S.view = "auth"; if (/deactivated/i.test(e.message)) { try { await sb.auth.signOut(); } catch (x) {} } render(); return; }
  if (!S.me.name || !S.me.phone) { S.view = "profile"; render(); return; }
  try { var dv = deviceId(); if (dv) await rpc("customer_set_device", { p_device: dv }); } catch (e) {}
  await loadPromo();
  loadWallet(); checkPush(); loadFavs();
  if (payReturnStart()) return;
  if (S.me.active_order) { await openOrder(S.me.active_order); return; }
  S.view = "home"; render();
}
// ---------------- Email code (no links: the code is typed in the app) ----------------
var VERIFY = { sentAt: 0 };
function startVerify(email, msg) {
  S.authEmail = email; S.authMode = "verify"; S.authMsg = msg || ""; if (!VERIFY.sentAt) VERIFY.sentAt = Date.now();
  try { localStorage.setItem("pb_verify_email", email); } catch (e) {}
  S.busy = false; render(); setTimeout(function () { var c = $("v_code"); if (c) c.focus(); }, 50);
}
function vEmailCode() {
  var wait = Math.max(0, 60 - Math.floor((Date.now() - VERIFY.sentAt) / 1000));
  return '<div class="body"><div style="text-align:center;font-size:56px;line-height:1;margin-top:18px">&#9993;&#65039;</div><h1 style="text-align:center;margin:0;font-size:22px">Check your email</h1>'
    + (S.authMsg ? '<div class="note n-info">' + h(S.authMsg) + "</div>" : "")
    + '<div class="card" style="display:flex;flex-direction:column;gap:12px"><div class="small muted">Code sent to <b>' + h(S.authEmail) + "</b>. It can take a minute. Check your Spam folder too.</div>"
    + '<div class="field"><label for="v_code">8-digit code</label><input class="in" id="v_code" inputmode="numeric" autocomplete="one-time-code" maxlength="8" placeholder="••••••••" style="font-size:24px;letter-spacing:6px;text-align:center"></div>'
    + '<button class="btn pri" data-act="verify">Confirm</button>'
    + '<button class="btn" data-act="resendcode" id="resendbtn"' + (wait ? " disabled" : "") + ">" + (wait ? "Send a new code in " + wait + "s" : "Send a new code") + "</button></div>"
    + '<button class="btn" data-act="verifyback">Use a different email</button></div>';
}
setInterval(function () { var b = $("resendbtn"); if (!b || S.authMode !== "verify") return; var wait = Math.max(0, 60 - Math.floor((Date.now() - VERIFY.sentAt) / 1000)); b.disabled = wait > 0; b.textContent = wait ? "Send a new code in " + wait + "s" : "Send a new code"; }, 1000);
async function doVerify() {
  var code = (val("v_code") || "").replace(/\D/g, ""); if (code.length < 8) { toast("Enter the 8-digit code from the email", true); return; }
  await run(async function () {
    var r = await sb.auth.verifyOtp({ email: S.authEmail, token: code, type: "email" });
    if (r.error) r = await sb.auth.verifyOtp({ email: S.authEmail, token: code, type: "signup" });
    if (r.error || !r.data || !r.data.session) throw new Error("Wrong or expired code. Check the latest email, or tap \"Send a new code\".");
    try { localStorage.removeItem("pb_verify_email"); } catch (e) {}
    S.session = r.data.session; S.authMsg = ""; S.authMode = "login";
    await afterLogin();
  });
}
async function resendCode() {
  await run(async function () { var r = await sb.auth.resend({ type: "signup", email: S.authEmail }); if (r && r.error) throw new Error(r.error.message); VERIFY.sentAt = Date.now(); S.busy = false; render(); toast("New code sent to " + S.authEmail); });
}
// ---------------- Forgot password (email code, no links) ----------------
var RESET = { step: "email", sentAt: 0 };
function vForgot() {
  var wait = Math.max(0, 60 - Math.floor((Date.now() - RESET.sentAt) / 1000));
  var head = '<div class="body"><div style="text-align:center;font-size:52px;line-height:1;margin-top:18px">&#128273;</div><h1 style="text-align:center;margin:0;font-size:22px">Reset your password</h1>' + (S.authMsg ? '<div class="note n-info">' + h(S.authMsg) + "</div>" : "");
  if (RESET.step === "email") return head + '<div class="card" style="display:flex;flex-direction:column;gap:12px"><div class="small muted">Enter the email of your account. We will send you a 8-digit code.</div>'

    + '<div class="small muted" style="margin-top:8px">Email: <a href="mailto:pasuyolabs@gmail.com" style="color:var(--accent)">pasuyolabs@gmail.com</a></div></div>';
}
async function supLoadUnread() { try { S.supUnread = await rpc("support_unread"); } catch (e) { S.supUnread = 0; } }
async function supList() { S.supNew = false; S.supTicket = null; S.view = "support"; render(); window.scrollTo(0, 0); try { S.supItems = await rpc("support_my_tickets"); } catch (e) { S.supItems = []; toast(e.message, true); } if (S.view === "support") render(); }
function vSupport() {
  var items = S.supItems;

}
async function supView(id) { await run(async function () { S.supTicket = await rpc("support_ticket", { p_id: Number(id) }); S.view = "supticket"; render(); window.scrollTo(0, document.body.scrollHeight); supLoadUnread(); }); }

// ---------------- Orders ----------------
var pollT = null;
function stopPoll() { if (pollT) { clearInterval(pollT); pollT = null; } }
async function openOrder(id) {
  stopPoll(); S.order = await rpc("customer_order", { p_order: id }); S.rateStars = S.order.my_rating || 0; S.view = "track"; render(); window.scrollTo(0, 0);
  S.unread = 0; if (S.order.rider) refreshUnread(custChatLabel());
  if (ENDED.indexOf(S.order.status) < 0) pollT = setInterval(pollOrder, 3000);
}
async function pollOrder() {
  if (S.view !== "track" || !S.order) { stopPoll(); return; }
  try { var o = await rpc("customer_order", { p_order: S.order.id });
    if (sameButRider(o, S.order)) { S.order = o; updateRider(); }
    else if (JSON.stringify(o) !== JSON.stringify(S.order)) { S.order = o; render(); }
    if (o.rider && ENDED.indexOf(o.status) < 0) refreshUnread(custChatLabel());
    if (ENDED.indexOf(o.status) >= 0) stopPoll(); } catch (e) {}
}

// ---------------- Road routes on the map (follow the streets, not straight lines) ----------------
function pickShortest(j) { var rs = (j && j.routes) || []; if (!rs.length) return null; return rs.slice().sort(function (a, b) { return a.distance - b.distance; })[0]; }

  if (ROUTE_CACHE[key]) return ROUTE_CACHE[key];

    var segs = await Promise.all(parts); if (segs.some(function (x) { return !x; })) return null;
    var all = []; segs.forEach(function (x, n) { all = all.concat(n ? x.slice(1) : x); }); ROUTE_CACHE[key] = all; return all; }
  var u = "https://router.project-osrm.org/route/v1/driving/" + pts.map(function (p) { return p[1] + "," + p[0]; }).join(";") + "?overview=full&geometries=geojson&alternatives=3";
  var ctl = typeof AbortController !== "undefined" ? new AbortController() : null, t = setTimeout(function () { if (ctl) ctl.abort(); }, 8000);

  return line;

// The rider's way to the next stop (blue), re-drawn when the rider has moved about 250 m
var LEG = { map: null, line: null, from: null, to: null, at: 0 };

function custLeg() { var o = S.order; if (!mapObj || !o) return; var nx = o.rider && o.rider.lat != null && ENDED.indexOf(o.status) < 0 ? nextStopOf(o.status, o.stops) : null; updateLeg(mapObj, nx ? [o.rider.lat, o.rider.lng] : null, nx ? [nx.lat, nx.lng] : null); }

// ---------------- Chat with the other person on this booking ----------------
var CHAT = { id: null, data: null, timer: null, first: false };
function stopChat() { if (CHAT.timer) { clearInterval(CHAT.timer); CHAT.timer = null; } }
function chatTime(t) { return new Date(t).toLocaleTimeString("en-PH", { hour: "numeric", minute: "2-digit", timeZone: "Asia/Manila" }); }
function chatMsgs() {
  var d = CHAT.data; if (!d) return '<div class="spin">Loading…</div>';

  return d.messages.map(function (m) { return '<div class="msg ' + (m.mine ? "me" : "them") + '">' + h(m.body) + '<span class="t">' + chatTime(m.at) + (m.mine ? (m.read ? " · Seen" : " · Sent") : "") + "</span></div>"; }).join("");
}
function chatBar() {
  var d = CHAT.data; if (d && !d.open) return '<div class="chatbar"><div class="note n-info" style="flex:1">This booking has ended, so the chat is closed.</div></div>';
  return '<div class="chatbar"><div class="chips" style="flex-basis:100%;flex-wrap:nowrap;overflow-x:auto;padding-bottom:2px">' + CHAT_QUICK.map(function (q, i) { return '<button class="chip" style="white-space:nowrap" data-act="chatquick" data-i="' + i + '">' + h(q) + "</button>"; }).join("")
    + '</div><textarea class="in" id="chat_in" rows="1" maxlength="500" placeholder="Type a message" style="flex:1;min-height:46px;padding:11px 12px;resize:none"></textarea><button class="btn pri" style="width:auto;min-width:76px" data-act="chatsend">Send</button></div>';
}
function nearBottom() { return window.innerHeight + window.scrollY >= document.body.scrollHeight - 140; }

  el.innerHTML = chatMsgs();
  var b = $("chatbarwrap"); if (b && CHAT.data && !CHAT.data.open && !b.getAttribute("data-closed")) { b.innerHTML = chatBar(); b.setAttribute("data-closed", "1"); }
  var t = $("chattitle"); if (t && CHAT.data && CHAT.data.other_name) t.textContent = "Chat with " + CHAT.data.other_name;

function vProfile(first) {
  var nameBox = first
    ? '<div class="card" style="display:flex;flex-direction:column;gap:12px"><div class="field"><label for="p_name">Your full name</label><input class="in" id="p_name" autocomplete="name" value="' + h(S.me.name) + '"></div>'
      + '<div class="field"><label for="p_phone">Mobile number</label><input class="in" id="p_phone" type="tel" inputmode="numeric" maxlength="13" autocomplete="tel" placeholder="09XX XXX XXXX" value="' + h(phoneFmt(S.me.phone)) + '"></div>'
      + '<div class="note n-warn" style="margin:0">&#128274; Use your <b>real full name</b> (as on your ID) and your own number. After you save, only spelling mistakes can be corrected, with your ID.</div>'
      + '<button class="btn pri" data-act="saveprofile">Save</button></div>'
    : '<div class="card"><div class="line"><span class="muted">Name</span><span class="b">&#128274; ' + h(S.me.name) + '</span></div><div class="line"><span class="muted">Mobile</span><span>&#128274; ' + h(phoneFmt(S.me.phone)) + "</span></div>" + chgBox() + "</div>";
  return topBar(first ? "One more step" : "Account", first ? "" : "home") + '<div class="body">'
    + (first ? '<div class="note n-info">Riders need your name and mobile number to reach you about a delivery.</div>' : "")
    + nameBox
    + (first ? "" : '<div class="card"><div class="line"><span class="muted">Email</span><span>' + h(S.me.email) + '</span></div><div class="line"><span class="muted">Completed deliveries</span><span>' + h(S.me.completed_orders) + "</span></div></div>")
    + (first ? "" : favCard()) + (first ? "" : supCard()) + (first ? "" : vVerify()) + (first ? "" : pushCard(true))
    + '<button class="btn bad" data-act="signout">Sign out</button>' + (first ? "" : '<button class="link" data-act="delopen" style="background:none;border:none;color:var(--muted);text-decoration:underline;cursor:pointer;padding:6px">Delete my account</button>') + (first ? "" : '<div class="small" style="text-align:center"><a href="https://pasuyobuddy.com/terms.html" target="_blank" rel="noopener" style="color:var(--muted)">Terms &amp; Conditions</a> &middot; <a href="https://pasuyobuddy.com/privacy.html" target="_blank" rel="noopener" style="color:var(--muted)">Privacy Policy</a></div>' + '<div class="muted small" style="text-align:center">Version ' + CONFIG.version + "</div>") + "</div>" + (first ? "" : nav("account"));
}
// Name and number are locked after sign-up; changes go through a request that staff review
function chgBox() {
  var c = S.chg, st = c && c.status;
  var last = !c ? "" : st === "pending" ? '<div class="note n-warn" style="margin:8px 0 0">Correction waiting for review: ' + h(c.new_name) + " · " + h(phoneFmt(c.new_phone)) + "</div>"
    : st === "rejected" ? '<div class="note n-bad" style="margin:8px 0 0">Your last correction was not approved.' + (c.staff_note ? " Reason: " + h(c.staff_note) : "") + "</div>"
    : '<div class="note n-good" style="margin:8px 0 0">Your last correction was approved.</div>';
  var lock = '<div class="small muted" style="margin-top:6px">&#128274; Your name and number are locked. Only <b>spelling mistakes</b> can be corrected, with a photo of your ID. A different name is not allowed.</div>';
  if (st === "pending") return lock + last;
  if (!S.chgOpen) return lock + last + '<button class="btn sm" style="margin-top:8px" data-act="chgopen">Fix a spelling mistake / new number</button>';

<script>
// Show / hide password: an eye button inside every password box (login, sign-up, new password, PIN)
(function () {
  var EYE = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>';
  var NOEYE = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 19c-7 0-11-7-11-7a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 7 11 7a18.5 18.5 0 0 1-2.16 3.19"/><path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/><path d="M1 1l22 22"/></svg>';
