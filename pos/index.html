<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Buddy POS</title>
<meta name="description" content="Point of sale for your store – phone, tablet and computer, works offline.">
<meta name="theme-color" content="#1E3A8A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Buddy POS">
<link rel="manifest" id="manifestLink" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link id="appleIcon" rel="apple-touch-icon" href="apple-touch-icon.png">
<script src="config.js"></script>
<script>
// Store link (?s=my-store): show that store's name/logo right away and give it its own installable app.
(function () {
  var s = (new URLSearchParams(location.search).get("s") || "").toLowerCase().replace(/[^a-z0-9-]/g, "").slice(0, 40);
  window.POS_SLUG = s;
  if (!s) return;
  var cfg = window.POS_CONFIG || {};
  if (cfg.brandedApps && cfg.supabaseUrl) document.getElementById("manifestLink").href = cfg.supabaseUrl + "/functions/v1/pos-manifest?s=" + s;
  try {
    var b = JSON.parse(localStorage.getItem("buddypos_brand_" + s) || "null");
    if (b) {
      window.POS_BRAND = b;
      document.title = b.name;
      if (b.logo) document.getElementById("appleIcon").href = b.logo;
      document.querySelector('meta[name="apple-mobile-web-app-title"]').content = b.name;
    }
  } catch (e) {}
})();
</script>
<style>
:root{
  --brand:#1E3A8A; --brand-ink:#fff; --accent:#F59E0B;
  --bg:#F1F5F9; --card:#fff; --ink:#0F172A; --muted:#64748B; --line:#E2E8F0;
  --ok:#16A34A; --bad:#DC2626; --radius:14px;
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#0B1220; --card:#111A2E; --ink:#E2E8F0; --muted:#94A3B8; --line:#1E293B; }
}
:root[data-theme="dark"]{ --bg:#0B1220; --card:#111A2E; --ink:#E2E8F0; --muted:#94A3B8; --line:#1E293B; }
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.hidden{display:none!important}
.muted{color:var(--muted)}
a{color:var(--brand)}
.small{font-size:13px}
.row{display:flex;gap:8px;align-items:center}
.grow{flex:1;min-width:0}
.btn{border:0;border-radius:10px;padding:10px 14px;background:var(--brand);color:var(--brand-ink);font-weight:600}
.btn.secondary{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:var(--bad);color:#fff}
.btn.big{padding:14px 18px;font-size:17px;width:100%}
.btn:disabled{opacity:.5;cursor:default}
.input{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
label.f{display:block;margin:10px 0 4px;font-size:13px;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius)}

/* ---------- layout ---------- */
#app{display:flex;flex-direction:column;height:100%}
header.top{display:flex;align-items:center;gap:10px;padding:calc(10px + var(--safe-t)) 14px 10px;background:var(--brand);color:var(--brand-ink)}
header.top img{width:34px;height:34px;border-radius:8px;object-fit:cover;background:#fff}

/* ---------- sell ---------- */

/* ---------- receipt ---------- */

<body>
<div id="app"></div>
<div id="print"></div>

<script src="vendor/supabase-2.45.4.js"></script>
<script>
"use strict";
/* =====================================================================
   Buddy POS – offline-first point of sale with per-seller branding.
   Data: IndexedDB on the device + Supabase (sync between devices).
   ===================================================================== */

const CFG = window.POS_CONFIG || {};
const PAYMENTS = ["Cash", "GCash", "Maya", "Card", "Bank", "Other"];
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const uuid = () => (crypto.randomUUID ? crypto.randomUUID() :
  "10000000-1000-4000-8000-100000000000".replace(/[018]/g, (c) => (c ^ (crypto.getRandomValues(new Uint8Array(1))[0] & (15 >> (c / 4)))).toString(16)));
const cents = (n) => Math.round(Number(n || 0) * 100);
const fromCents = (c) => Math.round(c) / 100;

/* ---------------------------------------------------------------- IndexedDB */
const IDB = {
  db: null,
  open(name) {
    return new Promise((res, rej) => {
      const r = indexedDB.open(name, 1);
      r.onupgradeneeded = () => {
        const db = r.result;
        db.createObjectStore("kv");
        db.createObjectStore("products", { keyPath: "id" });
        const s = db.createObjectStore("sales", { keyPath: "id" });
        s.createIndex("sold_at", "sold_at");
        db.createObjectStore("outbox", { keyPath: "seq", autoIncrement: true });
      };
      r.onsuccess = () => { this.db = r.result; res(); };
      r.onerror = () => rej(r.error);
    });
  },
  req(store, mode, fn) {
    return new Promise((res, rej) => {
      const tx = this.db.transaction(store, mode);
      const out = fn(tx.objectStore(store));
      tx.oncomplete = () => res(out && "result" in out ? out.result : undefined);
      tx.onerror = () => rej(tx.error);
    });
  },
  get: (s, k) => IDB.req(s, "readonly", (o) => o.get(k)),
  put: (s, v, k) => IDB.req(s, "readwrite", (o) => (k === undefined ? o.put(v) : o.put(v, k))),
  del: (s, k) => IDB.req(s, "readwrite", (o) => o.delete(k)),
  all: (s) => IDB.req(s, "readonly", (o) => o.getAll()),
  putMany(s, rows) {
    return new Promise((res, rej) => {
      const tx = this.db.transaction(s, "readwrite");
      const o = tx.objectStore(s);
      rows.forEach((r) => o.put(r));
      tx.oncomplete = () => res();
      tx.onerror = () => rej(tx.error);
    });
  },
  salesBetween(from, to) {
    return IDB.req("sales", "readonly", (o) => o.index("sold_at").getAll(IDBKeyRange.bound(from, to)));
  }
};

/* ---------------------------------------------------------------- state */
const S = {
  sb: null, user: null, store: null, member: null, settings: null,
  slug: window.POS_SLUG || "", pubBrand: window.POS_BRAND || null,
  products: [], cart: [], discount: { value: 0, pct: false },
  tab: "sell", cat: "All", q: "",
  online: navigator.onLine, syncing: false, syncError: null, pending: 0,
  device: JSON.parse(localStorage.getItem("buddypos_device") || "null")
};
if (!S.device) {
  S.device = { code: Array.from(crypto.getRandomValues(new Uint8Array(2))).map((b) => "ABCDEFGHJKLMNPQRSTUVWXYZ"[b % 24]).join(""), cashier: "", paper: 58 };
  localStorage.setItem("buddypos_device", JSON.stringify(S.device));
}
const saveDevice = () => localStorage.setItem("buddypos_device", JSON.stringify(S.device));
const money = (n) => (S.store?.currency || "₱") + Number(n || 0).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });

function toast(msg, ms = 2200) {
  const t = document.createElement("div");
  t.className = "toast"; t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), ms);
}

/* ---------------------------------------------------------------- branding */
function applyBrand(brand) {
  const st = brand || S.store;
  const color = (st && /^#[0-9a-f]{6}$/i.test(st.theme_color)) ? st.theme_color : "#1E3A8A";
  document.documentElement.style.setProperty("--brand", color);
  // readable text on the brand color
  const [r, g, b] = [1, 3, 5].map((i) => parseInt(color.substr(i, 2), 16));
  document.documentElement.style.setProperty("--brand-ink", (r * 299 + g * 587 + b * 114) / 1000 > 160 ? "#0F172A" : "#fff");
  document.querySelector('meta[name="theme-color"]').setAttribute("content", color);
  document.title = st?.name || CFG.appName || "Buddy POS";
  document.querySelector('meta[name="apple-mobile-web-app-title"]').setAttribute("content", st?.name || "Buddy POS");
  $("#appleIcon").setAttribute("href", st?.logo || "apple-touch-icon.png");
  if (st?.slug) {
    // Each store has its own link (?s=slug) so "Install / Add to Home Screen" gives an app with ITS name and logo.
    S.slug = st.slug;
    localStorage.setItem("buddypos_brand_" + st.slug, JSON.stringify({ name: st.name, logo: st.logo, theme_color: st.theme_color, slug: st.slug }));
    const want = "?s=" + st.slug;
    if (location.search !== want) history.replaceState(null, "", location.pathname + want);
    setManifest(st.slug, st.logo ? st.logo.length : 0);
  }
}
function setManifest(slug, v) {
  if (!CFG.brandedApps) return;      // needs the pos-manifest edge function
  const href = `${CFG.supabaseUrl}/functions/v1/pos-manifest?s=${encodeURIComponent(slug)}&v=${v || 0}`;
  const link = document.getElementById("manifestLink");
  if (link.href !== href) link.href = href;
}

/* ---------------------------------------------------------------- sync */
// op "upsert": new/edited rows · "insert": append-only (sales; duplicates ignored) · "update": change an existing row
async function queue(table, row, op = "upsert") {
  await IDB.put("outbox", { table, row, op });
  S.pending++;
  renderSync();
  sync();
}

async function sendRows(table, op, rows) {
  if (op === "update") {
    for (const r of rows) {
      const { id, ...rest } = r;
      const { error } = await S.sb.from(table).update(rest).eq("id", id);
      if (error) return error;
    }
    return null;
  }
  const { error } = await S.sb.from(table).upsert(rows, op === "insert" ? { ignoreDuplicates: true } : undefined);
  return error;
}

async function flushOutbox() {
  const items = await IDB.all("outbox");
  S.pending = items.length;
  if (!items.length) return;
  const groups = {};
  for (const it of items) (groups[it.table + "|" + (it.op || "upsert")] ||= []).push(it);
  for (const [key, list] of Object.entries(groups)) {
    const [table, op] = key.split("|");
    for (let i = 0; i < list.length; i += 200) {
      const chunk = list.slice(i, i + 200);
      const dedup = new Map();
      chunk.forEach((it) => dedup.set(it.row.id, it.row)); // keep the latest version of each row
      let error = await sendRows(table, op, [...dedup.values()]);
      if (error && error.code === "42501") {
        // The server refused some rows (e.g. a sale made after the subscription ended):
        // send one by one, set refused rows aside so they never block the rest.
        error = null;
        for (const it of chunk) {
          const e = await sendRows(table, op, [it.row]);
          if (e && e.code !== "42501") { error = e; break; }
          if (e) {
            const rej = (await IDB.get("kv", "rejected")) || [];
            rej.push({ table, row: it.row, at: new Date().toISOString(), reason: e.message });
            await IDB.put("kv", rej, "rejected");
          }
          await IDB.del("outbox", it.seq);
          S.pending--;
        }
        if (error) throw error;
        continue;
      }
      if (error) throw error;
      for (const it of chunk) await IDB.del("outbox", it.seq);
      S.pending -= chunk.length;
    }
  }
}

async function pullTable(table, localStore) {
  const key = "pull_" + table;
  let since = (await IDB.get("kv", key)) || null;
  const pendingIds = new Set((await IDB.all("outbox")).map((o) => o.row.id));
  for (;;) {
    let q = S.sb.from(table).select("*").eq("store_id", S.store.id).order("updated_at", { ascending: true }).limit(1000);
    if (since) q = q.gt("updated_at", since);
    else if (table === "pos_sales") q = q.gte("sold_at", new Date(Date.now() - 400 * 864e5).toISOString());
    const { data, error } = await q;
    if (error) throw error;
    if (!data.length) break;
    await IDB.putMany(localStore, data.filter((r) => !pendingIds.has(r.id)));
    since = data[data.length - 1].updated_at;
    await IDB.put("kv", since, key);
    if (data.length < 1000) break;
  }
}

async function pullStore() {
  const { data, error } = await S.sb.from("pos_stores").select("*").eq("id", S.member.store_id).maybeSingle();
  if (error) throw error;
  if (data) {
    const pendingStore = (await IDB.all("outbox")).some((o) => o.table === "pos_stores");
    if (!pendingStore) { S.store = data; await IDB.put("kv", data, "store"); applyBrand(); }
  }
  return data;
}

// membership (role) + platform settings (prices, GCash details)
async function pullMeta() {
  const [mem, set] = await Promise.all([
    S.sb.from("pos_members").select("store_id, role, name").eq("user_id", S.user.id).maybeSingle(),
    S.sb.from("pos_settings").select("*").eq("id", 1).maybeSingle()
  ]);
  if (mem.error) throw mem.error;
  if (!mem.data) {
    await IDB.put("kv", null, "member");
    toast("This account no longer has access to the store.", 4000);
    setTimeout(() => S.sb.auth.signOut(), 2500);
    throw new Error("removed from store");
  }
  const roleChanged = !S.member || mem.data.role !== S.member.role;
  S.member = mem.data;
  await IDB.put("kv", mem.data, "member");
  if (set.data) { S.settings = set.data; await IDB.put("kv", set.data, "settings"); }
  if (roleChanged) renderShell();
}

let syncTimer = null;
async function sync() {
  if (!S.sb || !S.user || !S.store || !S.member) return;
  if (S.syncing) { S.resync = true; return; }
  if (!navigator.onLine) { S.online = false; renderSync(); return; }
  S.syncing = true; S.syncError = null; renderSync();
  try {
    await flushOutbox();
    await pullMeta();
    await pullStore();
    await pullTable("pos_products", "products");
    await pullTable("pos_sales", "sales");
    S.products = (await IDB.all("products")).filter((p) => !p.deleted);
    S.online = true;
    await IDB.put("kv", new Date().toISOString(), "last_sync");
    renderBanner();
    refreshView();
  } catch (e) {
    console.warn("sync", e);
    S.syncError = e.message || String(e);
  } finally {
    S.syncing = false;
    renderSync();
    if (S.resync) { S.resync = false; setTimeout(sync, 300); }
  }
}
function startSyncLoop() {
  clearInterval(syncTimer);
  syncTimer = setInterval(() => { if (document.visibilityState === "visible") sync(); }, 20000);
}
window.addEventListener("online", () => { S.online = true; sync(); });
window.addEventListener("offline", () => { S.online = false; renderSync(); });
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") sync(); });

function renderSync() {
  const el = $("#syncState");
  if (!el) return;
  let cls = "", txt = "Synced";
  if (!navigator.onLine) { cls = "off"; txt = "Offline" + (S.pending ? ` · ${S.pending} to upload` : ""); }
  else if (S.syncError) { cls = "err"; txt = "Sync problem"; }
  else if (S.syncing) { cls = "off"; txt = "Syncing…"; }
  else if (S.pending) { cls = "off"; txt = `${S.pending} to upload`; }
  el.innerHTML = `<span class="dot ${cls}"></span>${txt}`;
  el.title = S.syncError || "";
}

/* ---------------------------------------------------------------- subscription status */
function subInfo() {
  const st = S.store || {};
  const now = Date.now();
  const trial = st.trial_ends_at ? Date.parse(st.trial_ends_at) : 0;
  const paid = st.paid_until ? Date.parse(st.paid_until) : 0;
  const end = Math.max(trial, paid);
  const days = Math.ceil((end - now) / 864e5);
  const suspended = st.plan === "suspended";
  const graceEnd = end + 3 * 864e5;                       // same 3-day grace as the server
  const canSell = !suspended && graceEnd > now;
  const kind = suspended ? "suspended" : end <= now ? "expired" : paid > now ? "pro" : "trial";
  return { end, days, canSell, kind, graceDays: Math.max(0, Math.ceil((graceEnd - now) / 864e5)) };
}
const fmtDate = (t) => new Date(t).toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" });

function renderBanner() {
  const el = $("#subBanner");
  if (!el || !S.store) return;
  const s = subInfo(), owner = S.member?.role === "owner";
  let txt = "", cls = "info";
  if (s.kind === "trial") txt = `Free trial · ${s.days} day${s.days === 1 ? "" : "s"} left` + (owner ? " · Subscribe" : "");
  else if (s.kind === "pro" && s.days <= 7) { txt = `Subscription ends in ${s.days} day${s.days === 1 ? "" : "s"}` + (owner ? " · Renew" : ""); cls = "warn"; }
  else if (s.kind === "expired") {
    cls = "bad";
    txt = s.canSell ? `Subscription expired · ${s.graceDays} day${s.graceDays === 1 ? "" : "s"} left before selling locks` : "Subscription expired · selling is locked";
    txt += owner ? " · Renew now" : " · Ask the owner to renew";
  } else if (s.kind === "suspended") { cls = "bad"; txt = "This store is suspended. Please contact support."; }
  el.className = "banner " + cls + (txt ? "" : " hidden");
  el.textContent = txt;
  el.onclick = owner && s.kind !== "suspended" ? () => { S.tab = "settings"; S.scrollTo = "subCard"; renderShell(); } : null;
}

/* ---------------------------------------------------------------- boot */
async function boot() {
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
  if (!CFG.supabaseUrl || !CFG.supabaseAnonKey || !window.supabase) {
    $("#app").innerHTML = `<div class="auth"><img class="logo" src="icon-192.png" alt=""><h1>Buddy POS</h1>
      <p class="muted" style="text-align:center">Setup needed: add the Supabase URL and anon key in <b>pos/config.js</b>.</p></div>`;
    return;
  }
  S.sb = window.supabase.createClient(CFG.supabaseUrl, CFG.supabaseAnonKey, {
    auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true, storageKey: "buddypos-auth" }
  });
  S.sb.auth.onAuthStateChange((event, session) => {
    if (event === "PASSWORD_RECOVERY") showResetPassword();
    if (event === "SIGNED_OUT") { localStorage.removeItem("buddypos_last_user"); location.reload(); }
    if (session?.user) S.user = session.user;
  });
  if (S.slug) loadPublicBrand();
  const { data } = await S.sb.auth.getSession();
  if (!data.session) {
    // Offline with an expired token: keep selling with the data on this device; sync resumes when online.
    const last = JSON.parse(localStorage.getItem("buddypos_last_user") || "null");
    if (last && !navigator.onLine) return enter(last);
    return showAuth();
  }
  await enter(data.session.user);
}

// Store branding for a store link (?s=slug), before anyone signs in.
async function loadPublicBrand() {
  try {
    const { data } = await S.sb.rpc("pos_public_brand", { p_slug: S.slug });
    const b = Array.isArray(data) ? data[0] : null;
    if (!b) return;
    S.pubBrand = b;
    localStorage.setItem("buddypos_brand_" + S.slug, JSON.stringify(b));
    if (!S.store) applyBrand(b);
    const logo = $("#authLogo"), name = $("#authName");
    if (logo) logo.src = b.logo || "icon-192.png";
    if (name) name.textContent = b.name;
  } catch (e) { console.warn(e); }
}

async function loadSettings() {
  if (S.settings) return S.settings;
  try {
    const { data } = await S.sb.from("pos_settings").select("*").eq("id", 1).maybeSingle();
    if (data) S.settings = data;
  } catch { /* offline */ }
  return S.settings || {};
}

async function enter(user) {
  S.user = user;
  localStorage.setItem("buddypos_last_user", JSON.stringify({ id: user.id, email: user.email }));
  await IDB.open("buddypos_" + user.id);
  S.member = (await IDB.get("kv", "member")) || null;
  S.store = (await IDB.get("kv", "store")) || null;
  S.settings = (await IDB.get("kv", "settings")) || null;
  S.pending = (await IDB.all("outbox")).length;
  if (navigator.onLine) {
    try {
      const { data: mem, error } = await S.sb.from("pos_members").select("store_id, role, name").eq("user_id", user.id).maybeSingle();
      if (error) throw error;
      S.member = mem || null;
      await IDB.put("kv", S.member, "member");
      if (mem) await pullStore();
    } catch (e) { console.warn(e); }
  }
  if (!S.member) return showChooseStore();
  if (!S.store) {
    $("#app").innerHTML = `<div class="auth"><h1>Almost there</h1><p class="muted" style="text-align:center">Connect to the internet once to download your store.</p>
      <button class="btn big" onclick="location.reload()">Try again</button></div>`;
    return;
  }
  applyBrand();
  S.products = (await IDB.all("products")).filter((p) => !p.deleted);
  if (S.member.role !== "owner" && !["sell", "sales", "settings"].includes(S.tab)) S.tab = "sell";
  renderShell();
  startSyncLoop();
  sync();
}

// square = pad to a square (for the app icon); otherwise keep the aspect ratio
function resizeImage(file, max, square = false, quality = 0.85) {
  return new Promise((res, rej) => {
    const img = new Image();
    img.onload = () => {
      const scale = Math.min(1, max / Math.max(img.width, img.height));
      const w = Math.round(img.width * scale), h = Math.round(img.height * scale);
      const c = document.createElement("canvas");
      c.width = square ? Math.max(w, h) : w; c.height = square ? Math.max(w, h) : h;
      const ctx = c.getContext("2d");
      if (square) { ctx.fillStyle = "#ffffff"; ctx.fillRect(0, 0, c.width, c.height); }
      ctx.drawImage(img, (c.width - w) / 2, (c.height - h) / 2, w, h);
      let url = square ? c.toDataURL("image/png") : c.toDataURL("image/jpeg", quality);
      if (url.length > 300000) url = c.toDataURL("image/jpeg", quality);
      URL.revokeObjectURL(img.src);
      res(url);
    };
    img.onerror = rej;
    img.src = URL.createObjectURL(file);
  });
}

/* ---------------------------------------------------------------- SELL */
function cartTotals() {
  const sub = S.cart.reduce((a, it) => a + cents(it.price) * it.qty, 0);
  let disc = S.discount.pct ? Math.round(sub * Math.min(100, Math.max(0, S.discount.value)) / 100) : cents(S.discount.value);
  disc = Math.min(Math.max(0, disc), sub);
  return { sub, disc, total: sub - disc, count: S.cart.reduce((a, it) => a + it.qty, 0) };
}

function addToCart(p) {
  const ex = S.cart.find((c) => c.product_id && c.product_id === p.id);
  if (ex) ex.qty++;
  else S.cart.push({ key: uuid(), product_id: p.id || null, name: p.name, price: Number(p.price), qty: 1 });
  renderCart();
  if (navigator.vibrate) navigator.vibrate(15);
}

function renderSell(m) {
  const cats = ["All", ...[...new Set(S.products.map((p) => p.category).filter(Boolean))].sort()];
  if (!cats.includes(S.cat)) S.cat = "All";
  m.innerHTML = `
  <div id="sell" style="flex:1">
    <div class="catalog">
      <input class="input" id="search" placeholder="Search or scan barcode…" value="${esc(S.q)}" autocomplete="off" enterkeyhint="search">
      <div class="chips">${cats.map((c) => `<button class="chip ${c === S.cat ? "on" : ""}" data-cat="${esc(c)}">${esc(c)}</button>`).join("")}</div>
      <div class="grid" id="grid"></div>
    </div>
    <div class="cartpane" id="cartPane"></div>
  </div>
  <button class="btn big" id="cartBar"></button>`;
  const search = $("#search");
  search.oninput = () => { S.q = search.value; renderGrid(); };
  search.onkeydown = (e) => {
    if (e.key !== "Enter") return;
    const v = search.value.trim();
    if (!v) return;
    const byCode = S.products.find((p) => p.barcode && p.barcode === v);
    const hits = byCode ? [byCode] : filteredProducts();
    if (hits.length === 1) { addToCart(hits[0]); search.value = ""; S.q = ""; renderGrid(); }
    else if (!hits.length) toast("No product found");
  };
  document.querySelectorAll(".chip").forEach((b) => b.onclick = () => { S.cat = b.dataset.cat; renderSell(m); });
  $("#cartBar").onclick = () => openCartSheet();
  renderGrid();
  renderCart();
}

function filteredProducts() {
  const q = S.q.trim().toLowerCase();
  return S.products
    .filter((p) => (S.cat === "All" || p.category === S.cat) &&
      (!q || p.name.toLowerCase().includes(q) || (p.barcode || "").includes(q)))
    .sort((a, b) => a.name.localeCompare(b.name));
}

function renderGrid() {
  const g = $("#grid");
  if (!g) return;
  const list = filteredProducts();
  g.innerHTML = `<button class="tile custom" id="customItem"><span class="n">+ Custom item</span><span class="small">any price</span></button>` +
    list.map((p) => `<button class="tile" data-id="${p.id}"><span class="n">${esc(p.name)}</span><span class="p">${money(p.price)}</span></button>`).join("") +
    (S.products.length ? "" : `<div class="muted small" style="grid-column:1/-1;padding:8px">No products yet. Add them in the <b>Products</b> tab, or use Custom item.</div>`);
  g.querySelectorAll(".tile[data-id]").forEach((b) => b.onclick = () => addToCart(S.products.find((p) => p.id === b.dataset.id)));
  $("#customItem").onclick = () => {
    openModal(`<h2>Custom item</h2>
      <label class="f">Name</label><input class="input" id="cuName" value="Item">
      <label class="f">Price</label><input class="input" id="cuPrice" type="number" inputmode="decimal" step="0.01" min="0">
      <button class="btn big" id="cuAdd" style="margin-top:14px">Add to cart</button>`);
    $("#cuPrice").focus();
    $("#cuAdd").onclick = () => {
      const price = Number($("#cuPrice").value);
      if (!(price >= 0) || $("#cuPrice").value === "") return toast("Enter a price");
      S.cart.push({ key: uuid(), product_id: null, name: $("#cuName").value.trim() || "Item", price, qty: 1 });
      closeModal(); renderCart();
    };
  };
}

function cartHTML() {
  const t = cartTotals();
  return `
    <div class="row" style="padding:12px 12px 0"><b class="grow">Cart (${t.count})</b>
      ${S.cart.length ? `<button class="btn secondary small clearCart" style="padding:6px 10px">Clear</button>` : ""}</div>
    <div class="cartlist">
      ${S.cart.length ? S.cart.map((it) => `
        <div class="ci">
          <div class="grow"><div style="font-weight:600">${esc(it.name)}</div><div class="small muted">${money(it.price)}</div></div>
          <div class="q"><button data-dec="${it.key}">−</button><span style="min-width:24px;text-align:center">${it.qty}</span><button data-inc="${it.key}">+</button></div>
          <div style="width:84px;text-align:right;font-weight:600">${money(fromCents(cents(it.price) * it.qty))}</div>
        </div>`).join("") : `<p class="muted" style="text-align:center;margin-top:40px">Tap products to add them</p>`}
    </div>
    <div class="totals">
      <div class="t"><span>Subtotal</span><span>${money(fromCents(t.sub))}</span></div>
      <div class="t"><a href="#" class="discBtn">Discount${S.discount.value ? ` (${S.discount.pct ? S.discount.value + "%" : money(S.discount.value)})` : ""}</a><span>−${money(fromCents(t.disc))}</span></div>
      <div class="t grand"><span>Total</span><span>${money(fromCents(t.total))}</span></div>
      ${subInfo().canSell
        ? `<button class="btn big chargeBtn" style="margin-top:8px" ${S.cart.length ? "" : "disabled"}>Charge ${money(fromCents(t.total))}</button>`
        : `<button class="btn big chargeBtn" style="margin-top:8px" disabled>Selling locked · subscription expired</button>`}
    </div>`;
}

function wireCart(root) {
  root.querySelectorAll("[data-inc]").forEach((b) => b.onclick = () => { S.cart.find((c) => c.key === b.dataset.inc).qty++; renderCart(); });
  root.querySelectorAll("[data-dec]").forEach((b) => b.onclick = () => {
    const it = S.cart.find((c) => c.key === b.dataset.dec);
    if (--it.qty <= 0) S.cart = S.cart.filter((c) => c !== it);
    renderCart();
  });
  const clr = $(".clearCart", root);
  if (clr) clr.onclick = () => { S.cart = []; S.discount = { value: 0, pct: false }; renderCart(); };
  $(".discBtn", root).onclick = (e) => { e.preventDefault(); openDiscount(); };
  $(".chargeBtn", root).onclick = () => openPayment();
}

function renderCart() {
  const pane = $("#cartPane");
  if (pane) {
    // the side cart is only shown on wider screens; phones use the cart sheet
    if (getComputedStyle(pane).display !== "none") { pane.innerHTML = cartHTML(); wireCart(pane); }
    else pane.innerHTML = "";
  }
  const sheet = $("#cartSheet");
  if (sheet) { sheet.innerHTML = cartHTML(); wireCart(sheet); }
  const bar = $("#cartBar");
  if (bar) {
    const t = cartTotals();
    bar.textContent = t.count ? `View cart (${t.count}) · ${money(fromCents(t.total))}` : "Cart is empty";
    bar.classList.toggle("hidden", !t.count);
  }
}

function openCartSheet() {
  openModal(`<div id="cartSheet" style="display:flex;flex-direction:column"></div>`);
  renderCart();
}

function openDiscount() {
  openModal(`<h2>Discount</h2>
    <div class="row">
      <input class="input grow" id="dVal" type="number" inputmode="decimal" min="0" step="0.01" value="${S.discount.value || ""}" placeholder="0">
      <select class="input" id="dType" style="width:110px"><option value="amt">${esc(S.store.currency || "₱")}</option><option value="pct" ${S.discount.pct ? "selected" : ""}>%</option></select>
    </div>
    <div class="row" style="margin-top:14px">
      <button class="btn secondary grow" id="dNone">No discount</button>
      <button class="btn grow" id="dOk">Apply</button>
    </div>`);
  $("#dVal").focus();
  $("#dNone").onclick = () => { S.discount = { value: 0, pct: false }; closeModal(); renderCart(); };
  $("#dOk").onclick = () => {
    S.discount = { value: Math.max(0, Number($("#dVal").value) || 0), pct: $("#dType").value === "pct" };
    closeModal(); renderCart();
  };
}

function openPayment() {
  if (!subInfo().canSell) { toast("Subscription expired – renew to continue selling", 3500); return; }
  const t = cartTotals();
  let method = "Cash";
  const total = fromCents(t.total);
  const quick = [...new Set([total, ...[20, 50, 100, 200, 500, 1000].filter((v) => v >= total).slice(0, 4)])];
  openModal(`<h2>Payment · ${money(total)}</h2>
    <div class="pay">${PAYMENTS.map((p) => `<button data-m="${p}" class="${p === method ? "on" : ""}">${p}</button>`).join("")}</div>
    <div id="cashBox">
      <label class="f">Cash received</label>
      <input class="input" id="cashIn" type="number" inputmode="decimal" min="0" step="0.01" placeholder="${total.toFixed(2)}">
      <div class="cashq">${quick.map((v) => `<button data-v="${v}">${v === total ? "Exact" : money(v)}</button>`).join("")}</div>
      <div class="row" style="margin-top:10px;font-size:18px"><span class="grow">Change</span><b id="changeOut">${money(0)}</b></div>
    </div>
    <div id="payErr" class="err"></div>
    <button class="btn big" id="payDone" style="margin-top:14px">Complete sale</button>`);
  const upd = () => {
    const rec = $("#cashIn").value === "" ? total : Number($("#cashIn").value);
    $("#changeOut").textContent = money(Math.max(0, fromCents(cents(rec) - t.total)));
  };
  document.querySelectorAll(".pay button").forEach((b) => b.onclick = () => {
    method = b.dataset.m;
    document.querySelectorAll(".pay button").forEach((x) => x.classList.toggle("on", x === b));
    $("#cashBox").classList.toggle("hidden", method !== "Cash");
  });
  document.querySelectorAll(".cashq button").forEach((b) => b.onclick = () => { $("#cashIn").value = b.dataset.v; upd(); });
  $("#cashIn").oninput = upd;
  $("#payDone").onclick = async () => {
    let received = null, change = null;
    if (method === "Cash") {
      received = $("#cashIn").value === "" ? total : Number($("#cashIn").value);
      if (cents(received) < t.total) { $("#payErr").textContent = "Cash received is less than the total."; return; }
      change = fromCents(cents(received) - t.total);
    }
    $("#payDone").disabled = true;
    const sale = await completeSale(method, received, change);
    closeModal();
    showReceipt(sale, true);
  };
}

async function nextReceiptNo() {
  const d = new Date();
  const day = `${String(d.getFullYear()).slice(2)}${String(d.getMonth() + 1).padStart(2, "0")}${String(d.getDate()).padStart(2, "0")}`;
  const key = "rcpt_" + day;
  const n = ((await IDB.get("kv", key)) || 0) + 1;
  await IDB.put("kv", n, key);
  return `${day}-${S.device.code}${String(n).padStart(3, "0")}`;
}

async function completeSale(method, received, change) {
  const t = cartTotals();
  const sale = {
    id: uuid(),
    store_id: S.store.id,
    receipt_no: await nextReceiptNo(),
    items: S.cart.map((c) => ({ product_id: c.product_id, name: c.name, price: c.price, qty: c.qty })),
    subtotal: fromCents(t.sub),
    discount: fromCents(t.disc),
    total: fromCents(t.total),
    payment_method: method.toLowerCase(),
    cash_received: received,
    change_due: change,
    cashier: S.device.cashier || S.member?.name || null,
    device: S.device.code,
    sold_at: new Date().toISOString(),
    voided: false,
    voided_at: null
  };
  await IDB.put("sales", sale);
  S.cart = []; S.discount = { value: 0, pct: false };
  renderCart();
  queue("pos_sales", sale, "insert");
  return sale;
}

/* ---------------------------------------------------------------- receipt */
function receiptHTML(sale) {
  const st = S.store;
  const dt = new Date(sale.sold_at);
  return `<div class="receipt" style="width:${S.device.paper === 80 ? "76mm" : "54mm"};max-width:100%;margin:0 auto">
    <div class="c">
      ${st.logo ? `<img src="${esc(st.logo)}" alt="">` : ""}
      <div class="big">${esc(st.name)}</div>
      ${st.address ? `<div>${esc(st.address)}</div>` : ""}
      ${st.phone ? `<div>${esc(st.phone)}</div>` : ""}
    </div>
    <hr>
    <div class="l"><span>Receipt</span><span>${esc(sale.receipt_no)}</span></div>
    <div class="l"><span>${dt.toLocaleDateString()}</span><span>${dt.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })}</span></div>
    ${sale.cashier ? `<div class="l"><span>Cashier</span><span>${esc(sale.cashier)}</span></div>` : ""}
    ${sale.voided ? `<div class="void">VOID</div>` : ""}
    <hr>
    ${sale.items.map((it) => `<div>${esc(it.name)}</div>
      <div class="l"><span>&nbsp;${it.qty} × ${Number(it.price).toFixed(2)}</span><span>${fromCents(cents(it.price) * it.qty).toFixed(2)}</span></div>`).join("")}
    <hr>
    <div class="l"><span>Subtotal</span><span>${Number(sale.subtotal).toFixed(2)}</span></div>
    ${Number(sale.discount) ? `<div class="l"><span>Discount</span><span>-${Number(sale.discount).toFixed(2)}</span></div>` : ""}
    <div class="l big"><span>TOTAL</span><span>${money(sale.total)}</span></div>
    <div class="l"><span>Paid (${esc(payLabel(sale.payment_method))})</span><span>${Number(sale.cash_received ?? sale.total).toFixed(2)}</span></div>
    ${sale.change_due != null ? `<div class="l"><span>Change</span><span>${Number(sale.change_due).toFixed(2)}</span></div>` : ""}
    <hr>
    ${st.receipt_footer ? `<div class="c">${esc(st.receipt_footer)}</div>` : ""}
  </div>`;
}
const cap = (s) => String(s || "").charAt(0).toUpperCase() + String(s || "").slice(1);
const payLabel = (m) => PAYMENTS.find((p) => p.toLowerCase() === String(m || "").toLowerCase()) || cap(m);

function receiptText(sale) {
  const st = S.store, L = [];
  L.push(st.name);
  if (st.address) L.push(st.address);
  if (st.phone) L.push(st.phone);
  L.push("--------------------", `Receipt ${sale.receipt_no}`, new Date(sale.sold_at).toLocaleString());
  if (sale.voided) L.push("*** VOID ***");
  L.push("--------------------");
  sale.items.forEach((it) => L.push(`${it.name}`, `  ${it.qty} x ${Number(it.price).toFixed(2)} = ${fromCents(cents(it.price) * it.qty).toFixed(2)}`));
  L.push("--------------------");
  if (Number(sale.discount)) L.push(`Discount: -${Number(sale.discount).toFixed(2)}`);
  L.push(`TOTAL: ${money(sale.total)}`, `Paid (${payLabel(sale.payment_method)}): ${Number(sale.cash_received ?? sale.total).toFixed(2)}`);
  if (sale.change_due != null) L.push(`Change: ${Number(sale.change_due).toFixed(2)}`);
  if (st.receipt_footer) L.push("", st.receipt_footer);
  return L.join("\n");
}

function showReceipt(sale, fresh = false) {
  openModal(`
    ${fresh ? `<h2 style="text-align:center;color:var(--ok)">✓ Sale complete</h2>
      ${sale.change_due ? `<p style="text-align:center;font-size:20px;margin:0 0 10px">Change: <b>${money(sale.change_due)}</b></p>` : ""}` : `<h2>Receipt</h2>`}
    ${receiptHTML(sale)}
    <div class="row" style="margin-top:14px;flex-wrap:wrap">
      <button class="btn secondary grow" id="rPrint">Print</button>
      <button class="btn secondary grow" id="rShare">Share</button>
      ${!fresh && !sale.voided && S.member?.role === "owner" ? `<button class="btn danger grow" id="rVoid">Void</button>` : ""}
    </div>
    <button class="btn big" id="rDone" style="margin-top:10px">${fresh ? "New sale" : "Close"}</button>`);
  $("#rPrint").onclick = () => { $("#print").innerHTML = receiptHTML(sale); window.print(); };
  $("#rShare").onclick = async () => {
    const text = receiptText(sale);
    try {
      if (navigator.share) await navigator.share({ title: `${S.store.name} receipt ${sale.receipt_no}`, text });
      else { await navigator.clipboard.writeText(text); toast("Receipt copied"); }
    } catch { /* cancelled */ }
  };
  $("#rDone").onclick = () => { closeModal(); if (S.tab !== "sell") refreshView(); };
  const v = $("#rVoid");
  if (v) v.onclick = async () => {
    if (!confirm(`Void receipt ${sale.receipt_no}? It will no longer count in sales.`)) return;
    sale.voided = true; sale.voided_at = new Date().toISOString();
    await IDB.put("sales", sale);
    queue("pos_sales", { id: sale.id, voided: true, voided_at: sale.voided_at }, "update");
    closeModal(); refreshView(); toast("Sale voided");
  };
}

/* ---------------------------------------------------------------- PRODUCTS */
function renderProducts(m) {
  const q = (S.pq || "").toLowerCase();
  const list = S.products.filter((p) => !q || p.name.toLowerCase().includes(q) || (p.category || "").toLowerCase().includes(q) || (p.barcode || "").includes(q))
    .sort((a, b) => (a.category || "").localeCompare(b.category || "") || a.name.localeCompare(b.name));
  m.innerHTML = `<div class="view">
    <div class="row" style="margin-bottom:10px">
      <input class="input grow" id="pSearch" placeholder="Search products…" value="${esc(S.pq || "")}">
      <button class="btn" id="pAdd">+ Add</button>
    </div>
    <div class="card list">${list.length ? list.map((p) => `
      <div class="it" data-id="${p.id}" style="cursor:pointer">
        <div class="grow"><div style="font-weight:600">${esc(p.name)}</div>
          <div class="small muted">${esc(p.category || "No category")}${p.barcode ? " · " + esc(p.barcode) : ""}</div></div>
        <b>${money(p.price)}</b>
      </div>`).join("") : `<div class="it muted">No products yet. Tap <b>+ Add</b>.</div>`}
    </div>
    <p class="small muted">${S.products.length} products</p></div>`;
  $("#pSearch").oninput = (e) => { S.pq = e.target.value; const pos = e.target.selectionStart; renderProducts(m); const i = $("#pSearch"); i.focus(); i.setSelectionRange(pos, pos); };
  $("#pAdd").onclick = () => editProduct(null);
  m.querySelectorAll(".it[data-id]").forEach((el) => el.onclick = () => editProduct(S.products.find((p) => p.id === el.dataset.id)));
}

function editProduct(p) {
  const cats = [...new Set(S.products.map((x) => x.category).filter(Boolean))].sort();
  openModal(`<h2>${p ? "Edit product" : "New product"}</h2>
    <label class="f">Name *</label><input class="input" id="epName" maxlength="120" value="${esc(p?.name || "")}">
    <label class="f">Price *</label><input class="input" id="epPrice" type="number" inputmode="decimal" min="0" step="0.01" value="${p ? Number(p.price) : ""}">
    <label class="f">Category</label><input class="input" id="epCat" list="catList" maxlength="60" value="${esc(p?.category || "")}" placeholder="e.g. Drinks">
    <datalist id="catList">${cats.map((c) => `<option value="${esc(c)}">`).join("")}</datalist>
    <label class="f">Barcode (optional)</label><input class="input" id="epCode" maxlength="64" value="${esc(p?.barcode || "")}" placeholder="Scan or type">
    <div class="row" style="margin-top:16px">
      ${p ? `<button class="btn danger" id="epDel">Delete</button>` : ""}
      <button class="btn grow" id="epSave">Save</button>
    </div>`);
  $("#epName").focus();
  $("#epSave").onclick = async () => {
    const name = $("#epName").value.trim(), price = Number($("#epPrice").value);
    if (!name) return toast("Enter a name");
    if ($("#epPrice").value === "" || !(price >= 0)) return toast("Enter a valid price");
    const row = {
      id: p?.id || uuid(), store_id: S.store.id, name, price: fromCents(cents(price)),
      category: $("#epCat").value.trim() || null, barcode: $("#epCode").value.trim() || null, deleted: false
    };
    await IDB.put("products", row);
    S.products = S.products.filter((x) => x.id !== row.id).concat(row);
    queue("pos_products", row);
    closeModal(); refreshView(); toast("Saved");
  };
  const del = $("#epDel");
  if (del) del.onclick = async () => {
    if (!confirm(`Delete "${p.name}"?`)) return;
    const row = { ...p, deleted: true };
    await IDB.put("products", row);
    S.products = S.products.filter((x) => x.id !== p.id);
    queue("pos_products", row);
    closeModal(); refreshView();
  };
}

/* ---------------------------------------------------------------- SALES */
function localDateStr(d) {
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
}
async function renderSales(m) {
  S.sDate ||= localDateStr(new Date());
  const [y, mo, d] = S.sDate.split("-").map(Number);
  const from = new Date(y, mo - 1, d).toISOString(), to = new Date(y, mo - 1, d + 1).toISOString();
  const sales = (await IDB.salesBetween(from, to)).sort((a, b) => b.sold_at.localeCompare(a.sold_at));
  const valid = sales.filter((s) => !s.voided);
  const total = valid.reduce((a, s) => a + cents(s.total), 0);
  const byMethod = {};
  valid.forEach((s) => byMethod[s.payment_method] = (byMethod[s.payment_method] || 0) + cents(s.total));
  const items = {};
  valid.forEach((s) => s.items.forEach((it) => items[it.name] = (items[it.name] || 0) + it.qty));
  const top = Object.entries(items).sort((a, b) => b[1] - a[1]).slice(0, 5);
  if (S.tab !== "sales") return;
  m.innerHTML = `<div class="view">
    <div class="row" style="margin-bottom:10px">
      <input class="input" type="date" id="sDate" value="${S.sDate}" style="max-width:200px">
      <button class="btn secondary" id="sToday">Today</button>
    </div>
    <div class="stats">
      <div class="card stat"><div class="small muted">Total sales</div><div class="v">${money(fromCents(total))}</div></div>
      <div class="card stat"><div class="small muted">Transactions</div><div class="v">${valid.length}</div></div>
      ${Object.entries(byMethod).map(([k, v]) => `<div class="card stat"><div class="small muted">${esc(payLabel(k))}</div><div class="v" style="font-size:18px">${money(fromCents(v))}</div></div>`).join("")}
    </div>
    ${top.length ? `<div class="card" style="padding:12px;margin-bottom:12px"><b>Best sellers</b>
      ${top.map(([n, q]) => `<div class="row small"><span class="grow">${esc(n)}</span><span>${q}</span></div>`).join("")}</div>` : ""}
    <div class="card list">${sales.length ? sales.map((s) => `
      <div class="it" data-id="${s.id}" style="cursor:pointer">
        <div class="grow"><div style="font-weight:600">${esc(s.receipt_no)} ${s.voided ? '<span class="badge bad">VOID</span>' : ""}</div>
          <div class="small muted">${new Date(s.sold_at).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })} · ${esc(payLabel(s.payment_method))} · ${s.items.reduce((a, i) => a + i.qty, 0)} items${s.cashier ? " · " + esc(s.cashier) : ""}</div></div>
        <b style="${s.voided ? "text-decoration:line-through;opacity:.6" : ""}">${money(s.total)}</b>
      </div>`).join("") : `<div class="it muted">No sales on this day.</div>`}
    </div></div>`;
  $("#sDate").onchange = (e) => { S.sDate = e.target.value || localDateStr(new Date()); renderSales(m); };
  $("#sToday").onclick = () => { S.sDate = localDateStr(new Date()); renderSales(m); };
  m.querySelectorAll(".it[data-id]").forEach((el) => el.onclick = () => showReceipt(sales.find((s) => s.id === el.dataset.id)));
}

/* ---------------------------------------------------------------- SETTINGS */
async function renderSettings(m) {
  const state = {};
  const last = await IDB.get("kv", "last_sync");
  if (S.tab !== "settings") return;
  const owner = S.member?.role === "owner";
  const sub = subInfo();
  const set = S.settings || {};
  const link = appLink(S.store.slug);
  const statusLine = {
    trial: `<b>Free trial</b> · ${sub.days} day${sub.days === 1 ? "" : "s"} left (ends ${fmtDate(sub.end)})`,
    pro: `<b>Active</b> · paid until ${fmtDate(sub.end)}`,
    expired: `<b style="color:var(--bad)">Expired</b> on ${fmtDate(sub.end)}${sub.canSell ? ` · selling locks in ${sub.graceDays} day${sub.graceDays === 1 ? "" : "s"}` : " · selling is locked"}`,
    suspended: `<b style="color:var(--bad)">Suspended</b> · please contact support`
  }[sub.kind];
  m.innerHTML = `<div class="view" style="max-width:680px">
    ${owner ? `
    <div class="card" id="subCard" style="padding:16px;margin-bottom:12px">
      <h3 style="margin:0 0 6px">Subscription</h3>
      <div>${statusLine}</div>
      <div class="plan" style="margin-top:12px">
        <div class="card stat"><div class="small muted">Monthly</div><div class="v" style="font-size:20px">${money(set.price_monthly ?? 0)}</div></div>
        <div class="card stat"><div class="small muted">Yearly</div><div class="v" style="font-size:20px">${money(set.price_yearly ?? 0)}</div>
          ${set.price_monthly && set.price_yearly < set.price_monthly * 12 ? `<div class="small" style="color:var(--ok)">Save ${Math.round(100 - set.price_yearly / (set.price_monthly * 12) * 100)}%</div>` : ""}</div>
      </div>
      <button class="btn big" id="payBtn" ${sub.kind === "suspended" ? "disabled" : ""}>${sub.kind === "pro" ? "Renew / extend" : "Subscribe now"}</button>
      <div id="payList" class="small" style="margin-top:12px"></div>
      ${set.support_contact ? `<div class="small muted" style="margin-top:8px">Questions? ${esc(set.support_contact)}</div>` : ""}
    </div>
    <div class="card" style="padding:16px;margin-bottom:12px">
      <h3 style="margin:0 0 6px">Your app</h3>
      <div class="small muted">Open this link on any phone, tablet or computer and install it. It shows <b>your</b> name and logo.</div>
      <div class="row" style="margin-top:8px">
        <input class="input grow" readonly value="${esc(link)}" id="myLink">
        <button class="btn secondary" id="copyLink">Copy</button>
        ${navigator.share ? `<button class="btn secondary" id="shareLink">Share</button>` : ""}
      </div>
    </div>
    <div class="card" style="padding:16px;margin-bottom:12px">
      <h3 style="margin:0 0 6px">Staff</h3>
      <div class="small muted">Cashiers can sell and see sales. Only you can change products, prices, branding and void sales.</div>
      <div id="staffList" class="list" style="margin-top:8px"><div class="it muted small">${navigator.onLine ? "Loading…" : "Connect to the internet to manage staff."}</div></div>
      <button class="btn secondary" id="inviteBtn" style="margin-top:10px">+ Invite a cashier</button>
    </div>
    <div class="card" style="padding:16px;margin-bottom:12px">
      <h3 style="margin:0 0 4px">Store branding</h3>
      <div class="small muted">Name, logo and receipt details for <b>${esc(S.store.name)}</b>.</div>
      ${brandingForm(S.store)}
      <button class="btn big" id="bSave" style="margin-top:14px">Save branding</button>
    </div>` : ""}
    <div class="card" style="padding:16px;margin-bottom:12px">
      <h3 style="margin:0 0 4px">This device</h3>
      <label class="f">Cashier name (printed on receipts)</label>
      <input class="input" id="dCashier" maxlength="40" value="${esc(S.device.cashier || S.member?.name || "")}">
      <label class="f">Receipt paper width</label>
      <select class="input" id="dPaper" style="width:160px">
        <option value="58" ${S.device.paper !== 80 ? "selected" : ""}>58 mm</option>
        <option value="80" ${S.device.paper === 80 ? "selected" : ""}>80 mm</option>
      </select>
      <div class="small muted" style="margin-top:8px">Device code: ${esc(S.device.code)} (used in receipt numbers)</div>
    </div>
    <div class="card" style="padding:16px;margin-bottom:12px">
      <h3 style="margin:0 0 4px">Account</h3>
      <div>${esc(S.user.email || "")} <span class="badge">${owner ? "Owner" : "Cashier"}</span></div>
      <div class="small muted">Last sync: ${last ? new Date(last).toLocaleString() : "never"}${S.pending ? ` · ${S.pending} waiting to upload` : ""}</div>
      ${S.syncError ? `<div class="err small">Sync problem: ${esc(S.syncError)}</div>` : ""}
      <div class="row" style="margin-top:12px;flex-wrap:wrap">
        <button class="btn secondary" id="syncNow">Sync now</button>
        <button class="btn secondary" id="signOut">Sign out</button>
        <a class="btn secondary hidden" id="adminLink" href="admin.html" style="text-decoration:none">Admin dashboard</a>
      </div>
    </div>
    <div class="card" style="padding:16px">
      <h3 style="margin:0 0 6px">Install on your device</h3>
      <div class="small">
        <b>Android:</b> Chrome menu ⋮ → <i>Add to Home screen / Install app</i>.<br>
        <b>iPhone / iPad:</b> Safari → Share → <i>Add to Home Screen</i>.<br>
        <b>Windows PC:</b> Chrome or Edge → ⋮ → <i>Install ${esc(S.store.name)}</i> (or the install icon in the address bar).<br>
        <b>Mac:</b> Safari → File → <i>Add to Dock</i>, or Chrome → install icon in the address bar.
      </div>
    </div></div>`;

  if (S.scrollTo) { const el = document.getElementById(S.scrollTo); if (el) el.scrollIntoView(); S.scrollTo = null; }
  $("#dCashier").onchange = (e) => { S.device.cashier = e.target.value.trim(); saveDevice(); };
  $("#dPaper").onchange = (e) => { S.device.paper = Number(e.target.value); saveDevice(); };
  $("#syncNow").onclick = async () => { await sync(); refreshView(); toast(S.syncError ? "Sync problem: " + S.syncError : "Synced"); };
  $("#signOut").onclick = async () => {
    if (S.pending && !confirm(`${S.pending} changes are not uploaded yet. Sign out anyway? They stay on this device and upload next time you sign in.`)) return;
    await S.sb.auth.signOut();
  };
  if (navigator.onLine) S.sb.rpc("pos_is_admin").then(({ data }) => { if (data === true && $("#adminLink")) $("#adminLink").classList.remove("hidden"); });
  if (!owner) return;

  // ---- subscription
  $("#payBtn").onclick = () => openSubscribe();
  loadPayments();
  // ---- app link
  $("#copyLink").onclick = async () => { try { await navigator.clipboard.writeText(link); toast("Link copied"); } catch { $("#myLink").select(); } };
  const sh = $("#shareLink");
  if (sh) sh.onclick = () => navigator.share({ title: S.store.name, text: `${S.store.name} POS`, url: link }).catch(() => {});
  // ---- staff
  loadStaff();
  $("#inviteBtn").onclick = async () => {
    if (!navigator.onLine) return toast("Connect to the internet to invite staff");
    const { data: code, error } = await S.sb.rpc("pos_create_invite");
    if (error) return toast(error.message, 4000);
    const msg = `You're invited to join ${S.store.name} as a cashier.\n1) Open ${link}\n2) Tap "Create account"\n3) Enter invite code: ${code}\n(The code works once and expires in 7 days.)`;
    openModal(`<h2>Invite a cashier</h2>
      <p class="small muted" style="margin:0">Give this code to your cashier. It works once and expires in 7 days.</p>
      <div class="code">${esc(code)}</div>
      <pre class="small" style="white-space:pre-wrap;background:var(--bg);padding:10px;border-radius:8px">${esc(msg)}</pre>
      <div class="row"><button class="btn secondary grow" id="invCopy">Copy message</button>
      ${navigator.share ? `<button class="btn grow" id="invShare">Share</button>` : ""}</div>`);
    $("#invCopy").onclick = async () => { try { await navigator.clipboard.writeText(msg); toast("Copied"); } catch { /* ignore */ } };
    const s2 = $("#invShare");
    if (s2) s2.onclick = () => navigator.share({ title: `Join ${S.store.name}`, text: msg }).catch(() => {});
    loadStaff();
  };
  // ---- branding
  wireBrandingForm(state);
  $("#bSave").onclick = async () => {
    const row = readBrandingForm(state, S.store);
    if (!row) return;
    S.store = row;
    await IDB.put("kv", row, "store");
    applyBrand();
    const { id, name, logo, address, phone, receipt_footer, currency, theme_color } = row;
    queue("pos_stores", { id, name, logo, address, phone, receipt_footer, currency, theme_color }, "update");
    renderShell(); toast("Branding saved");
  };
}

async function loadPayments() {
  const el = $("#payList");
  if (!el || !navigator.onLine) return;
  const { data, error } = await S.sb.from("pos_payments").select("id, period, amount, method, reference, status, note, created_at")
    .eq("store_id", S.store.id).order("created_at", { ascending: false }).limit(10);
  if (error || !data?.length || !$("#payList")) return;
  const badge = { pending: '<span class="badge">Waiting for approval</span>', approved: '<span class="badge" style="background:#DCFCE7;color:#166534">Approved</span>', rejected: '<span class="badge bad">Rejected</span>' };
  el.innerHTML = `<b>Your payments</b>` + data.map((p) => `<div class="row" style="padding:6px 0;border-bottom:1px solid var(--line)">
      <span class="grow">${fmtDate(p.created_at)} · ${p.period === "yearly" ? "1 year" : "1 month"} · ${money(p.amount)}${p.reference ? " · Ref " + esc(p.reference) : ""}
      ${p.note ? `<br><span class="muted">${esc(p.note)}</span>` : ""}</span>${badge[p.status] || ""}</div>`).join("");
}

async function loadStaff() {
  const el = $("#staffList");
  if (!el || !navigator.onLine) return;
  const [mem, inv] = await Promise.all([
    S.sb.from("pos_members").select("user_id, role, name, email").eq("store_id", S.store.id).order("created_at"),
    S.sb.from("pos_invites").select("code, expires_at").eq("store_id", S.store.id).is("used_by", null).gt("expires_at", new Date().toISOString())
  ]);
  if (!$("#staffList")) return;
  if (mem.error) { el.innerHTML = `<div class="it err small">${esc(mem.error.message)}</div>`; return; }
  el.innerHTML = mem.data.map((u) => `<div class="it">
      <div class="grow"><div style="font-weight:600">${esc(u.name || u.email)}</div><div class="small muted">${esc(u.email || "")}</div></div>
      <span class="badge">${u.role === "owner" ? "Owner" : "Cashier"}</span>
      ${u.role === "cashier" ? `<button class="btn secondary small" data-rm="${u.user_id}" style="padding:6px 10px">Remove</button>` : ""}
    </div>`).join("") + (inv.data || []).map((i) => `<div class="it">
      <div class="grow"><div style="font-weight:600;letter-spacing:2px">${esc(i.code)}</div><div class="small muted">Invite · expires ${fmtDate(i.expires_at)}</div></div>
      <button class="btn secondary small" data-inv="${esc(i.code)}" style="padding:6px 10px">Cancel</button></div>`).join("");
  el.querySelectorAll("[data-rm]").forEach((b) => b.onclick = async () => {
    if (!confirm("Remove this cashier? They will lose access to the store.")) return;
    const { error } = await S.sb.from("pos_members").delete().eq("user_id", b.dataset.rm).eq("store_id", S.store.id);
    if (error) toast(error.message); else loadStaff();
  });
  el.querySelectorAll("[data-inv]").forEach((b) => b.onclick = async () => {
    await S.sb.from("pos_invites").delete().eq("code", b.dataset.inv);
    loadStaff();
  });
}

async function openSubscribe() {
  if (!navigator.onLine) return toast("Connect to the internet to subscribe");
  const { data } = await S.sb.from("pos_settings").select("*").eq("id", 1).maybeSingle();
  const set = data || S.settings || {};
  S.settings = set;
  let proof = null;
  openModal(`<h2>Subscribe</h2>
    <div class="plan">
      <div><input type="radio" name="per" id="perM" value="monthly" checked><label for="perM"><b>Monthly</b><br>${money(set.price_monthly)}</label></div>
      <div><input type="radio" name="per" id="perY" value="yearly"><label for="perY"><b>Yearly</b><br>${money(set.price_yearly)}</label></div>
    </div>
    <div class="card" style="padding:12px;background:var(--bg)">
      <b>1. Send <span id="payAmt">${money(set.price_monthly)}</span> to:</b>
      ${set.gcash_number ? `<div style="margin-top:6px">GCash: <b>${esc(set.gcash_number)}</b>${set.gcash_name ? ` (${esc(set.gcash_name)})` : ""}</div>` : ""}
      ${set.gcash_qr ? `<img src="${esc(set.gcash_qr)}" alt="GCash QR" style="max-width:220px;width:100%;display:block;margin:8px auto;border-radius:8px">` : ""}
      ${set.bank_details ? `<div style="margin-top:6px;white-space:pre-wrap">${esc(set.bank_details)}</div>` : ""}
      ${!set.gcash_number && !set.bank_details ? `<div class="muted">Payment details coming soon. ${esc(set.support_contact || "")}</div>` : ""}
    </div>
    <b style="display:block;margin-top:12px">2. Tell us about your payment</b>
    <label class="f">Paid with</label>
    <select class="input" id="payMethod"><option value="gcash">GCash</option><option value="bank">Bank transfer</option><option value="other">Other</option></select>
    <label class="f">Reference number</label>
    <input class="input" id="payRef" maxlength="80" placeholder="e.g. 1234 567 890123">
    <label class="f">Screenshot of the payment *</label>
    <input type="file" id="payProof" accept="image/*">
    <img id="payProofPrev" class="hidden" style="max-width:160px;margin-top:8px;border-radius:8px" alt="">
    <div id="payErr" class="err"></div>
    <button class="btn big" id="paySubmit" style="margin-top:14px">Submit payment</button>
    <p class="small muted" style="text-align:center">Your plan is extended as soon as the payment is confirmed.</p>`);
  document.querySelectorAll('input[name=per]').forEach((r) => r.onchange = () => {
    $("#payAmt").textContent = money(r.value === "yearly" ? set.price_yearly : set.price_monthly);
  });
  $("#payProof").onchange = async (e) => {
    const f = e.target.files[0];
    if (!f) return;
    try { proof = await resizeImage(f, 1280, false, 0.7); $("#payProofPrev").src = proof; $("#payProofPrev").classList.remove("hidden"); }
    catch { toast("Could not read that image"); }
  };
  $("#paySubmit").onclick = async () => {
    if (!proof) { $("#payErr").textContent = "Please attach the screenshot of your payment."; return; }
    $("#paySubmit").disabled = true;
    const period = document.querySelector('input[name=per]:checked').value;
    const { error } = await S.sb.from("pos_payments").insert({
      store_id: S.store.id, period, method: $("#payMethod").value, reference: $("#payRef").value.trim() || null, proof
    });
    if (error) { $("#payErr").textContent = error.message; $("#paySubmit").disabled = false; return; }
    closeModal();
    toast("Payment submitted! You'll be activated once it's confirmed.", 4000);
    loadPayments();
  };
}

/* ---------------------------------------------------------------- modal */
function openModal(html) {
  closeModal();
  const m = document.createElement("div");
  m.className = "modal"; m.id = "modal";
  m.innerHTML = `<div class="sheet">${html}</div>`;
  m.onclick = (e) => { if (e.target === m) closeModal(); };
  document.body.appendChild(m);
}
function closeModal() { const m = $("#modal"); if (m) m.remove(); }
document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeModal(); });

boot().catch((e) => {
  console.error(e);
  $("#app").innerHTML = `<div class="auth"><h1>Buddy POS</h1><p class="err">${esc(e.message || e)}</p></div>`;
});
</script>
</body>
</html>
